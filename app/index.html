<style>
/* Layout idea: a working ledger. Fixed sidebar (company + modules), a main column
   of tables and forms; figures in mono so columns of money line up like a journal. */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --ink: #0f1b2d;
  --muted: #56657c;
  --line: #d9e1ec;
  --accent: #1a56c9;
  --accent-soft: #e5eefc;
  --accent-ink: #ffffff;
  --side: #0b2a5e;
  --side-ink: #e3ecfb;
  --side-muted: #9fb5dc;
  --good: #1d7a3d; --good-soft: #e3f3e7;
  --warn: #9a5a00; --warn-soft: #fbefd9;
  --crit: #b42318; --crit-soft: #fbe5e2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #121b2c; --ink: #e4ebf6; --muted: #93a3bc; --line: #24314a;
    --accent: #5b9bff; --accent-soft: #15284d; --accent-ink: #061024;
    --side: #08101e; --side-ink: #dbe6fa; --side-muted: #7f93b5;
    --good: #5cc581; --good-soft: #15291c; --warn: #e4a94a; --warn-soft: #2d2213; --crit: #f0786c; --crit-soft: #331816;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #121b2c; --ink: #e4ebf6; --muted: #93a3bc; --line: #24314a;
  --accent: #5b9bff; --accent-soft: #15284d; --accent-ink: #061024;
  --side: #08101e; --side-ink: #dbe6fa; --side-muted: #7f93b5;
  --good: #5cc581; --good-soft: #15291c; --warn: #e4a94a; --warn-soft: #2d2213; --crit: #f0786c; --crit-soft: #331816;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { text-align: end; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.main, .page, .page > * { min-width: 0; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 20px; padding: 20px 14px; overflow-y: auto; }
.brand { font-family: var(--font-display); font-size: 19px; font-weight: 700; padding: 0 8px; display: flex; align-items: center; gap: 8px; }
.brand-logo { display: block; height: 30px; width: auto; }
.brand-logo .l { stroke: currentColor; }
.brand-logo .o1 { stroke: var(--logo-o1, var(--accent)); }
.brand-logo .o2 { stroke: #f28c28; }
.side .brand-logo { --logo-o1: #5b9bff; color: #ffffff; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 13px; }
.tenant-box { background: rgba(255,255,255,.06); border-radius: var(--radius); padding: 10px; display: grid; gap: 6px; }
.tenant-box label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--side-muted); }
.tenant-box select { width: 100%; background: transparent; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; padding: 6px 8px; color: var(--side-ink); }
.tenant-box select option { color: #0f1b2d; }
.tenant-meta { font-size: 12px; color: var(--side-muted); }
.nav { display: grid; gap: 2px; }
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--side-muted); padding: 10px 10px 4px; }
.nav .nav-item { color: var(--side-ink); background: transparent; border: 0; font: inherit; text-align: start; cursor: pointer; padding: 7px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
.nav .nav-item:hover { background: rgba(255,255,255,.06); }
.nav .nav-item[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.nav .count { font-family: var(--font-mono); font-size: 12px; background: rgba(255,255,255,.12); border-radius: 10px; padding: 0 7px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--side-muted); padding: 0 8px; display: grid; gap: 4px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.dot.warn { background: var(--warn); }

.main { overflow-y: auto; height: 100%; }
.page { max-width: 1120px; margin: 0 auto; padding: 28px 28px 64px; display: grid; gap: 22px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ai-tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; border-radius: 4px; padding: 0 5px; background: var(--accent-soft); color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card-pad { padding: 18px; }
.card-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px; display: grid; gap: 4px; }
.kpi .label { color: var(--muted); font-size: 13px; }
.kpi .value { font-family: var(--font-mono); font-size: 21px; font-weight: 500; letter-spacing: -0.02em; }
.kpi .hint { font-size: 12px; color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; align-items: start; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: start; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--accent-soft); }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.draft { color: var(--muted); background: var(--bg); }
.pill.issued { color: var(--accent); background: var(--accent-soft); }
.pill.partial { color: var(--warn); background: var(--warn-soft); }
.pill.paid { color: var(--good); background: var(--good-soft); }
.pill.late { color: var(--crit); background: var(--crit-soft); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

form.stack, .stack { display: grid; gap: 14px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; color: var(--muted); }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
input[type="text"], input[type="email"], input[type="date"], input[type="number"], input[type="search"], select, textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--surface); width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
.hint-text { font-size: 12px; color: var(--muted); }
.error-text { color: var(--crit); font-size: 13px; }

.overlay { position: fixed; inset: 0; background: rgba(8, 16, 13, .45); display: grid; place-items: start center; padding: 6vh 16px 16px; overflow-y: auto; z-index: 20; }
.modal { background: var(--surface); border-radius: 10px; width: min(760px, 100%); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 18px 20px; display: grid; gap: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }

.lines-table td { padding: 6px 6px; border-bottom: 0; }
.lines-table th { padding: 6px; }
.lines-table input, .lines-table select { padding: 5px 7px; }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 24px; justify-content: end; margin-inline-start: auto; min-width: 280px; }
.totals .grand { font-weight: 600; font-size: 17px; border-top: 1px solid var(--line); padding-top: 6px; }

.doc { border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 16px; background: var(--surface); }
.doc-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.entry { border-inline-start: 3px solid var(--accent); padding-inline-start: 12px; }

.bars { display: block; width: 100%; height: auto; direction: ltr; }
.bars text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.bars .bar { fill: var(--accent); }
.bars .bar.current { fill: var(--accent); opacity: .55; }
.bars .grid { stroke: var(--line); }

.activity { list-style: none; margin: 0; padding: 0; display: grid; }
.activity li { padding: 9px 18px; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
.activity li:last-child { border-bottom: 0; }

.chat { display: grid; grid-template-rows: 1fr auto; min-height: 520px; }
.chat-log { padding: 18px; display: grid; gap: 14px; align-content: start; max-height: 60vh; overflow-y: auto; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; }
.msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); }
.msg.assistant { justify-self: start; background: var(--bg); }
.chat-form { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; }

.banner { border-radius: var(--radius); padding: 10px 14px; font-size: 14px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); }
.banner.info { background: var(--accent-soft); }
.toast { position: fixed; inset-inline-end: 18px; bottom: 18px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 40; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast.error { background: var(--crit); color: #fff; }
.fc-chart .bar.proj { fill: var(--accent); opacity: .28; }
.fc-chart .bar.below { fill: var(--warn); }
.fc-chart .target { stroke: var(--ink); stroke-width: 2; }
.fc-chart .grid { stroke: var(--line); }
.fc-chart .zero { stroke: var(--muted); stroke-dasharray: 3 3; }
.fc-chart text.now { fill: var(--accent); font-weight: 600; }
.fc-chart .area { fill: var(--accent); opacity: .12; }
.fc-chart .area.neg { fill: var(--crit); }
.fc-chart .cash-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.fc-chart .pt { fill: var(--accent); }
.fc-chart .pt.neg { fill: var(--crit); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend .sw { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--accent); }
.legend .sw.proj { opacity: .28; }
.legend .sw.tgt { height: 2px; background: var(--ink); vertical-align: 3px; }
.legend .sw.below { background: var(--warn); }
.target-input { width: 120px !important; text-align: end; font-family: var(--font-mono); padding: 4px 7px !important; }
tr.current-row td { background: var(--accent-soft); }
.export-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.export-grid .card { align-content: start; }
.fmt-tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .04em; border-radius: 4px; padding: 1px 6px; margin-bottom: 6px; }
.fmt-tag.xlsx { background: #e3f3e7; color: #1d6b3a; }
.fmt-tag.pdf { background: #fbe5e2; color: #a5281d; }
.fmt-tag.docx { background: #e3ecfb; color: #1f4f9a; }
.loading { display: grid; place-items: center; height: 100%; color: var(--muted); }
.welcome { max-width: 640px; margin: 8vh auto; padding: 0 20px; display: grid; gap: 18px; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; gap: 10px; overflow: visible; min-width: 0; }
  .nav { display: flex; overflow-x: auto; gap: 4px; width: 100%; min-width: 0; }
  .nav .nav-item { flex: none; white-space: nowrap; width: auto; }
  .tenant-box { min-width: 0; }
  .page-head .actions { width: 100%; }
  .table-wrap > table { min-width: 620px; }
  .table-wrap td.mono, .table-wrap td.num { white-space: nowrap; }
  .nav-group, .side-foot, .tenant-meta { display: none; }
  .tenant-box { flex: 1; padding: 6px; }
  .tenant-box label { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: 1fr; }
  .export-grid { grid-template-columns: 1fr; }
  .page { padding: 18px 16px 48px; }
}
@media (max-width: 420px) { .kpis { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

[dir="rtl"] body { font-family: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, var(--font-body); }
[dir="rtl"] .num, [dir="rtl"] .mono { direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] td.num, [dir="rtl"] th.num { text-align: left; }
[dir="rtl"] th.num, [dir="rtl"] .kpi .label, [dir="rtl"] .nav .count { font-family: inherit; direction: rtl; }
/* Help & support */
.help-fab { position: fixed; inset-inline-end: 18px; bottom: 18px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: 20px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.14); z-index: 30; }
.help-fab:hover { background: var(--accent-soft); }
.toast { bottom: 72px; }
.help-search input { min-width: 260px; max-width: 100%; }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 12px; margin-bottom: 16px; }
.guide-card { display: flex; flex-direction: column; gap: 6px; text-align: start; padding: 16px; cursor: pointer; font: inherit; color: inherit; border: 1px solid var(--line); min-width: 0; }
.guide-card:hover { border-color: var(--accent); }
.guide-module { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); font-weight: 600; }
.help-cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
.article .steps { padding-inline-start: 22px; display: grid; gap: 10px; line-height: 1.55; }
.feedback { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; }
details.faq { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.faq summary { cursor: pointer; font-weight: 600; }
details.faq p { margin: 8px 0 0; line-height: 1.55; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; text-align: center; }
tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--bg); }
.ticket-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.thread { display: grid; gap: 10px; }
.tmsg { max-width: min(640px, 92%); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); }
.tmsg.me { justify-self: end; background: var(--accent-soft); border-color: transparent; }
.tmsg.them { justify-self: start; background: var(--bg); }
.tmeta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.tbody { white-space: pre-wrap; overflow-wrap: anywhere; }
label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; }
/* Stock & margins */
.bars .bar.ghost { fill: var(--accent); opacity: .22; }
.legend .sw.ghost { opacity: .22; }
.neg { color: var(--crit); }
.nowrap { white-space: nowrap; }
tr.total-row td { font-weight: 600; border-top: 1px solid var(--line); }
.meter { display: inline-block; inline-size: 60px; block-size: 6px; border-radius: 3px; background: var(--bg); vertical-align: middle; overflow: hidden; }
.meter > span { display: block; block-size: 100%; background: var(--accent); }
.inline-form { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.inline-form input { inline-size: 70px; }
.sim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 12px; padding: 12px; background: var(--bg); border-radius: 8px; }
.sim-grid strong { font-size: 16px; }
table.wide td:first-child { white-space: nowrap; }
.bars text.axis { font-size: 10px; }
.sim-grid .accent { color: var(--accent); }
.tenant-name { font-weight: 600; color: var(--side-ink); font-size: 15px; overflow-wrap: anywhere; }
.user-box { margin-top: auto; padding: 12px 10px; border-top: 1px solid rgba(255,255,255,.12); font-size: 13px; color: var(--side-ink); }
.user-box .user-name { font-weight: 600; }
.user-box .user-mail, .user-box .user-role { color: var(--side-muted); overflow-wrap: anywhere; }
.user-box .user-links { display: flex; gap: 12px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.user-box a, .user-box .link-btn { color: var(--side-ink); }

/* ============================================================================
   Domain: invoice computation and posting rules (double entry)
   ========================================================================== */
function allocate(total, weights) {
  const ws = sumBig(weights);
  if (ws === 0n) return weights.map((_, i) => (i === 0 ? total : 0n));
  const parts = weights.map((w) => (total * w) / ws);
  let rest = total - sumBig(parts);
  const order = weights.map((w, i) => ({ i, r: (total * w) % ws })).sort((a, b) => (a.r === b.r ? a.i - b.i : a.r > b.r ? -1 : 1));
  for (const { i } of order) { if (rest === 0n) break; parts[i] += 1n; rest -= 1n; }
  return parts;
}

/** VAT per rate on the sum of line nets (EN 16931 style), spread back on lines. */
function computeInvoice(lines) {
  if (!lines.length) throw new Error('Ajoutez au moins une ligne.');
  const out = lines.map((l) => {
    const disc = BigInt(l.discountBp || 0);
    const net = divRound(BigInt(l.qty) * BigInt(l.unitPrice) * (10000n - disc), 1000n * 10000n);
    return { ...l, net, tax: 0n };
  });
  const rates = [...new Set(out.map((l) => l.taxRateBp))].sort((a, b) => b - a);
  const taxes = rates.map((rate) => {
    const idx = out.flatMap((l, i) => (l.taxRateBp === rate ? [i] : []));
    const base = sumBig(idx.map((i) => out[i].net));
    const tax = divRound(base * BigInt(rate), 10000n);
    allocate(tax, idx.map((i) => out[i].net)).forEach((t, k) => { out[idx[k]].tax = t; });
    return { rate, base, tax };
  });
  const net = sumBig(out.map((l) => l.net)), tax = sumBig(taxes.map((t) => t.tax));
  return { lines: out, taxes, net, tax, gross: net + tax };
}

function makeEntry(journal, date, ref, label, source, raw) {
  const lines = raw.filter((r) => BigInt(r.amount) > 0n).map((r) => ({
    a: r.account, l: r.label || label, d: r.side === 'D' ? String(r.amount) : '0', c: r.side === 'C' ? String(r.amount) : '0',
  }));
  const d = sumBig(lines.map((l) => l.d)), c = sumBig(lines.map((l) => l.c));
  if (d !== c || d === 0n) throw new Error(tf('Écriture déséquilibrée (débit {d}, crédit {c}).', { d, c }));
  return { t: 'entry', id: newId(), journal, date, ref, label, source, lines, createdAt: new Date().toISOString() };
}

function postInvoice(inv, comp, customer, pack) {
  const a = PACKS[pack].acc;
  const label = `Facture ${inv.number} — ${customer.name}`;
  const goods = sumBig(comp.lines.filter((l) => l.kind === 'goods').map((l) => l.net));
  const services = sumBig(comp.lines.filter((l) => l.kind !== 'goods').map((l) => l.net));
  return makeEntry('VT', inv.issueDate, inv.number, label, { type: 'invoice', id: inv.id }, [
    { account: a.receivable, side: 'D', amount: comp.gross },
    { account: a.salesGoods, side: 'C', amount: goods },
    { account: a.salesServices, side: 'C', amount: services },
    ...comp.taxes.map((t) => ({ account: a.vatC, side: 'C', amount: t.tax, label: `${label} — TVA ${pct(t.rate)}` })),
  ]);
}
const treasury = (pack, method) => { const a = PACKS[pack].acc; return method === 'cash' ? a.cash : method === 'mobile_money' ? a.mm : a.bank; };
function postCustomerPayment(inv, p, customer, pack) {
  const label = `Règlement ${inv.number} — ${customer.name}`;

    { account: treasury(pack, p.method), side: 'D', amount: p.amount },
    { account: PACKS[pack].acc.receivable, side: 'C', amount: p.amount },

}

    { account: a.vatD, side: 'D', amount: bill.tax },

}

  const label = `Paiement ${bill.supplierRef || bill.number} — ${supplier.name}`;
  return makeEntry('BQ', p.date, bill.number, label, { type: 'bill_payment', id: p.id }, [

/** Same interface as claude.ai's sample capability, backed by the server's AI proxy (tools run here, in the page). */
function serverAi() {
  const toBlocks = async (prompt, images = []) => {
    const content = [];
    for (const file of images) {
      const buf = new Uint8Array(await file.arrayBuffer()); let bin = '';
      for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      content.push({ type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: btoa(bin) } });
    }
    content.push({ type: 'text', text: prompt });
    return content;
  };
  const run = async (input, opts = {}) => {
    let messages = typeof input === 'string' ? [{ role: 'user', content: await toBlocks(input, opts.images) }] : input.map((m) => ({ role: m.role, content: m.content }));
    const tools = (opts.tools || []).map((t) => ({ name: t.name, description: t.description, input_schema: t.inputSchema }));
    for (let turn = 0; turn < 6; turn++) {
      const r = await api('POST', 'ai', { tier: opts.modelTier === 'quick' ? 'quick' : 'default', messages, tools });
      const text = r.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
      const uses = r.content.filter((b) => b.type === 'tool_use');
      if (r.stop_reason !== 'tool_use' || !uses.length) { if (opts.onText) opts.onText({ text }); return { text }; }
      messages = [...messages, { role: 'assistant', content: r.content }, { role: 'user', content: uses.map((u) => {
        const tool = (opts.tools || []).find((t) => t.name === u.name);
        let out; try { out = tool ? tool.execute(u.input || {}) : { erreur: 'outil inconnu' }; } catch (e) { out = { erreur: String(e.message || e) }; }
        return { type: 'tool_result', tool_use_id: u.id, content: JSON.stringify(out).slice(0, 60000) };
      }) }];
    }
    return { text: '' };
  };
  const ai = (input, opts) => run(input, opts).catch((e) => { throw Object.assign(e, { code: e.code === 'not_granted' ? 'not_granted' : e.status === 429 ? 'rate_limited' : e.code }); });
  ai.json = async (prompt, opts = {}) => {
    const { text } = await run(prompt + '\nRéponds uniquement par le JSON, sans texte autour.', opts);
    const m = /\{[\s\S]*\}/.exec(text); if (!m) throw new Error('Réponse illisible');
    return JSON.parse(m[0]);
  };
  ai.limits = async () => ({ images: true });
  return ai;
}

  if (r.status === 401) { location.href = `/${SERVER.slug}/connexion`; throw Object.assign(new Error('Session expirée.'), { code: 'unauthenticated' }); }
  if (!r.ok) throw Object.assign(new Error(data.error || 'Erreur serveur.'), { code: data.code || 'error', status: r.status, number: data.number });
  return data;
}

if (DEMO) document.title = 'Jumtoo — démonstration';
const Store = {
  mode: 'memory', db: null, uid: null, mem: { tenants: {}, records: {} }, chains: new Map(), server: null, since: '',

  async init() {
    if (DEMO) { this.mode = 'memory'; return; }
    if (SERVER) {
      const st = await api('GET', 'state');
      this.mode = 'server'; this.uid = SERVER.user.id; this.since = st.serverTime;
      SERVER.access = st.access; SERVER.user.role = st.role;
      let meta = st.meta;
      if (!meta || !meta.country) {
        meta = { ...createTenantMeta(st.tenant.name, COUNTRIES[st.tenant.country] ? st.tenant.country : 'SN'), createdAt: st.tenant.createdAt, ...(meta || {}) };
        meta.audit = [{ at: new Date().toISOString(), actor: 'system', action: 'Espace créé', detail: st.tenant.name }];
        if (st.access !== 'readonly' && st.role !== 'reader') await api('PUT', 'meta', meta).catch(() => {});
      }
      meta.id = SERVER.slug; meta.name = st.tenant.name; meta.seq = meta.seq || {}; meta.audit = meta.audit || [];
      this.server = { meta, records: st.records };
      return;
    }
    const use = window.claude && typeof window.claude.use === 'function' ? window.claude.use.bind(window.claude) : null;
    if (use) {
      const timeout = new Promise((r) => setTimeout(() => r(null), 10000));
      try {
        const [db, user] = await Promise.race([Promise.all([use('db'), use('user')]), timeout.then(() => [null, null])]);
        const id = db && user ? await user.id() : null;
        if (db && id) { this.db = db; this.uid = id; this.mode = 'cloud'; return; }
      } catch (e) { /* fall through */ }
    }
    try {
      const raw = localStorage.getItem('pme-suite.v1');
      this.mem = raw ? JSON.parse(raw) : this.mem;
      this.mode = 'local';
    } catch { this.mode = 'memory'; }
  },
  flushLocal() {
    if (this.mode !== 'local') return;
    try { localStorage.setItem('pme-suite.v1', JSON.stringify(this.mem)); } catch { this.mode = 'memory'; }
  },
  queued(key, fn) {
    const prev = this.chains.get(key) || Promise.resolve();
    const p = prev.then(fn, fn);
    this.chains.set(key, p.catch(() => {}));
    return p;
  },
  tenantsCol() { return this.db.collection(`data/users/${this.uid}`); },
  recordsCol(tid) { return this.db.doc(`data/users/${this.uid}/${tid}`).collection('records'); },

  async listTenants() {
    if (this.mode === 'server') return [this.server.meta];
    // Snapshots are frozen: clone before the app mutates them.
    if (this.mode === 'cloud') return (await this.tenantsCol().get()).docs.map((d) => d.data()).filter(Boolean).map(clone);
    return Object.values(this.mem.tenants).map(clone);
  },
  async loadRecords(tid) {
    if (this.mode === 'server') return this.server.records;
    if (this.mode === 'cloud') return (await this.recordsCol(tid).get()).docs.map((d) => d.data()).filter(Boolean).map(clone);
    return Object.values(this.mem.records[tid] || {}).map(clone);
  },
  saveTenant(meta) {
    const body = JSON.parse(JSON.stringify(meta));
    if (this.mode === 'server') return this.queued('meta', () => api('PUT', 'meta', body)).then((r) => {
      // Numbers allocated by colleagues: never go back below the server's sequence.
      if (r && r.seq && S.t) for (const [k, v] of Object.entries(r.seq)) S.t.seq[k] = Math.max(Number(S.t.seq[k] || 0), Number(v));
    });
    if (this.mode === 'cloud') return this.queued('t/' + meta.id, () => this.tenantsCol().doc(meta.id).set(body));
    this.mem.tenants[meta.id] = body; this.flushLocal(); return Promise.resolve();
  },
  saveRecord(tid, rec) {
    const body = JSON.parse(JSON.stringify(rec));
    if (this.mode === 'server') {
      this.pending.set(rec.id, (this.pending.get(rec.id) || 0) + 1);
      return this.queued('r/' + rec.id, () => api('PUT', 'records/' + encodeURIComponent(rec.id), body))
        .finally(() => { const n = this.pending.get(rec.id) - 1; if (n > 0) this.pending.set(rec.id, n); else this.pending.delete(rec.id); });
    }
    if (this.mode === 'cloud') return this.queued('r/' + rec.id, () => this.recordsCol(tid).doc(rec.id).set(body));
    (this.mem.records[tid] ||= {})[rec.id] = body; this.flushLocal(); return Promise.resolve();
  },
  pending: new Map(),
  saveBatch(recs) {
    const body = { records: recs.map((r) => JSON.parse(JSON.stringify(r))) };
    for (const r of recs) this.pending.set(r.id, (this.pending.get(r.id) || 0) + 1);
    return this.queued('batch', () => api('PUT', 'batch', body)).finally(() => {
      for (const r of recs) { const n = this.pending.get(r.id) - 1; if (n > 0) this.pending.set(r.id, n); else this.pending.delete(r.id); }
    });
  },
  /** Pulls what colleagues changed since the last sync. */
  async pull() {
    if (this.mode !== 'server' || !S.t) return false;
    const ch = await api('GET', 'changes?since=' + encodeURIComponent(this.since));
    this.since = ch.serverTime;
    if (ch.access && ch.access !== SERVER.access) { SERVER.access = ch.access; applyServerAccess(); }
    let changed = false;
    for (const rec of ch.records) {
      if (this.pending.has(rec.id) || !S.r[rec.t]) continue;
      delete rec._by;
      const list = S.r[rec.t]; const i = list.findIndex((x) => x.id === rec.id);
      if (i >= 0) { if (JSON.stringify(list[i]) !== JSON.stringify(rec)) { list[i] = rec; changed = true; } } else { list.push(rec); changed = true; }
    }
    if (ch.meta) {
      for (const [k, v] of Object.entries(ch.meta.seq || {})) if (Number(v) > Number(S.t.seq[k] || 0)) { S.t.seq[k] = Number(v); changed = true; }
      const seen = new Set(S.t.audit.map((a) => a.at + a.action));
      const extra = (ch.meta.audit || []).filter((a) => !seen.has(a.at + a.action));
      if (extra.length) { S.t.audit = [...extra, ...S.t.audit].sort((a, b) => b.at.localeCompare(a.at)).slice(0, 80); changed = true; }
      for (const k of ['forecast', 'marginTargetBp']) if (ch.meta[k] !== undefined && JSON.stringify(ch.meta[k]) !== JSON.stringify(S.t[k])) { S.t[k] = ch.meta[k]; changed = true; }
    }
    return changed;
  },
  async deleteTenant(tid, records) {
    if (this.mode === 'server') throw new Error('Pour supprimer l’espace, résiliez l’abonnement depuis l’administration.');
    if (this.mode === 'cloud') {
      for (const r of records) await this.recordsCol(tid).doc(r.id).delete();
      await this.tenantsCol().doc(tid).delete();
      return;
    }
    delete this.mem.tenants[tid]; delete this.mem.records[tid]; this.flushLocal();
  },
};

/* ============================================================================
   Application state
   ========================================================================== */
const TYPES = ['customer', 'supplier', 'product', 'invoice', 'bill', 'entry'];
const S = {
  tenants: [], t: null, r: Object.fromEntries(TYPES.map((k) => [k, []])),
  view: 'tableau', invFilter: 'all', comptaTab: 'journal', modal: null, draft: null,
  ai: null, aiImages: false, downloads: null, imp: { type: 'customer', analysis: null, fileName: '', error: '', busy: false }, chat: [], chatBusy: false, saving: 0, readOnly: false,
};
const VIEWS = ['tableau', 'clients', 'produits', 'factures', 'achats', 'compta', 'previsions', 'echanges', 'copilote', 'parametres', 'aide', 'stock'];
const pack = () => PACKS[S.t.pack];
const cur = () => S.t.currency;
const byId = (type, id) => S.r[type].find((x) => x.id === id);

function persist(...recs) {
  if (S.silent) return;
  if (Store.mode === 'server') {
    // One business action = one transaction on the server (invoice + entry + stock together, or nothing).
    S.saving++;
    Store.saveBatch(recs).catch(onWriteError).finally(() => { S.saving--; renderSaving(); });
    renderSaving();
    return;
  }
  for (const rec of recs) {
    S.saving++;
    Store.saveRecord(S.t.id, rec).catch(onWriteError).finally(() => { S.saving--; renderSaving(); });
  }
  renderSaving();
}
function persistMeta() {
  if (S.silent) return;
  S.saving++;
  Store.saveTenant(S.t).catch(onWriteError).finally(() => { S.saving--; renderSaving(); });
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === 'number_taken' || code === 'conflict') {
    toast(code === 'number_taken' ? tf('Le numéro {n} vient d’être attribué par un collègue : rien n’a été enregistré. La page va se recharger, recommencez ensuite.', { n: e.number || '' }) : e.message, true);
    setTimeout(() => location.reload(), 3000); return;
  }
  if (code === 'read_only') { if (!S.readOnly) { S.readOnly = true; render(); } toast(e.message, true); return; }
  if (code === 'unauthenticated') return;
  if (code === 'invalid_argument' && !S.readOnly) { S.readOnly = true; toast("Vous n'avez pas le droit d'enregistrer ici : vos modifications restent visibles jusqu'à la fermeture de la page.", true); }
  else if (code === 'quota_exceeded') toast("L'espace de stockage est plein : supprimez une entreprise d'exemple pour continuer à enregistrer.", true);
  else if (!S.readOnly) toast("Une modification n'a pas pu être enregistrée. Vérifiez votre connexion.", true);
}
function audit(action, detail, actor = 'user') {
  S.t.audit = [{ at: new Date().toISOString(), actor, action, detail }, ...(S.t.audit || [])].slice(0, 80);
}
function nextNumber(key, prefix) {
  S.t.seq[key] = (S.t.seq[key] || 0) + 1;
  return prefix + String(S.t.seq[key]).padStart(6, '0');
}
function addRecord(rec) { S.r[rec.t].push(rec); return rec; }

/* ============================================================================
   Business actions (each one: domain → state → persist)
   ========================================================================== */
function createTenantMeta(name, country, demo = false) {
  const c = COUNTRIES[country];
  return { id: newId(), name: name.trim(), country, currency: c.currency, pack: c.pack, demo,
           createdAt: new Date().toISOString(), seq: {}, audit: [] };
}

function invoiceView(inv) {
  const due = BigInt(inv.gross) - BigInt(inv.paid || 0);
  const late = ['issued', 'partially_paid'].includes(inv.status) && inv.dueDate && inv.dueDate < today();
  return { due, late, lateDays: late ? daysBetween(inv.dueDate, today()) : 0 };
}

function buildInvoiceLines(draft) {
  return draft.lines.map((l, i) => {
    if (!l.description.trim()) throw new Error(tf('Ligne {n} : ajoutez une désignation.', { n: i + 1 }));
    return { description: l.description.trim(), qty: parseQty(l.qty), unitPrice: parseAmount(l.price, cur()),
             discountBp: Math.round(Number(String(l.discount || '0').replace(',', '.')) * 100) || 0,
             taxRateBp: Number(l.rate), kind: l.kind, productId: l.productId || null };
  });
}

function saveInvoice(draft, issueNow) {
  if (!draft.customerId) throw new Error('Choisissez un client.');
  const lines = buildInvoiceLines(draft);
  lines.forEach((l) => { if (l.discountBp < 0 || l.discountBp > 10000) throw new Error('Remise entre 0 et 100 %.'); });
  const comp = computeInvoice(lines);
  const inv = draft.id ? byId('invoice', draft.id) : addRecord({ t: 'invoice', id: newId(), status: 'draft', paid: '0', payments: [], reminders: [], createdAt: new Date().toISOString() });
  Object.assign(inv, {
    customerId: draft.customerId, issueDate: draft.issueDate, dueDays: Number(draft.dueDays) || 30, notes: draft.notes || '',
    lines: comp.lines.map((l) => ({ description: l.description, qty: String(l.qty), unitPrice: String(l.unitPrice), discountBp: l.discountBp,
      taxRateBp: l.taxRateBp, kind: l.kind, productId: l.productId, net: String(l.net), tax: String(l.tax) })),
    net: String(comp.net), tax: String(comp.tax), gross: String(comp.gross),
  });
  if (issueNow) return issueInvoice(inv.id);
  audit('Brouillon de facture enregistré', byId('customer', inv.customerId)?.name);
  persist(inv); persistMeta();
  return inv;
}

function issueInvoice(id) {
  const inv = byId('invoice', id);
  if (inv.status !== 'draft') throw new Error('Cette facture est déjà émise.');
  const customer = byId('customer', inv.customerId);
  const comp = computeInvoice(inv.lines.map((l) => ({ ...l, qty: BigInt(l.qty), unitPrice: BigInt(l.unitPrice) })));
  inv.number = nextNumber('invoice', 'F-');
  inv.issueDate = inv.issueDate || today();
  inv.dueDate = addDays(inv.issueDate, inv.dueDays || 30);
  const entry = addRecord(postInvoice(inv, comp, customer, S.t.pack));
  inv.entryId = entry.id; inv.status = 'issued'; inv.issuedAt = new Date().toISOString();
  const touched = [];
  for (const l of inv.lines) {
    const p = l.productId && byId('product', l.productId);
    if (p && p.trackStock) {
      p.onHand = String(BigInt(p.onHand || '0') - BigInt(l.qty));
      p.moves = [{ date: inv.issueDate, qty: String(-BigInt(l.qty)), ref: inv.number }, ...(p.moves || [])].slice(0, 2000);
      touched.push(p);
    }
  }
  audit('Facture émise', `${inv.number} — ${customer.name} — ${fmt(inv.gross, cur())}`);
  persist(inv, entry, ...touched); persistMeta();
  return inv;
}

function payInvoice(id, { amount, method, date, ref }) {
  const inv = byId('invoice', id);
  if (!['issued', 'partially_paid'].includes(inv.status)) throw new Error("Cette facture n'attend pas de paiement.");
  const amt = parseAmount(amount, cur());
  if (amt <= 0n) throw new Error('Le montant doit être positif.');
  const paid = BigInt(inv.paid || 0) + amt;
  if (paid > BigInt(inv.gross)) throw new Error(tf('Le paiement dépasse le reste dû ({due}).', { due: fmt(BigInt(inv.gross) - BigInt(inv.paid || 0), cur()) }));
  const customer = byId('customer', inv.customerId);
  const p = { id: newId(), date, amount: String(amt), method, ref: ref || '' };
  const entry = addRecord(postCustomerPayment(inv, p, customer, S.t.pack));
  p.entryId = entry.id;
  inv.payments = [...(inv.payments || []), p];
  inv.paid = String(paid);
  inv.status = paid === BigInt(inv.gross) ? 'paid' : 'partially_paid';
  audit('Paiement client enregistré', `${inv.number} — ${METHODS[method]} — ${fmt(amt, cur())}`);
  persist(inv, entry); persistMeta();
}

function saveBill(form) {
  let supplier = form.supplierId && byId('supplier', form.supplierId);
  if (!supplier) {
    if (!form.newSupplier?.trim()) throw new Error('Choisissez ou saisissez un fournisseur.');
    supplier = addRecord({ t: 'supplier', id: newId(), name: form.newSupplier.trim(), createdAt: new Date().toISOString() });
    persist(supplier);
  }
  const net = parseAmount(form.net, cur());
  if (net <= 0n) throw new Error('Le montant HT doit être positif.');
  const rate = Number(form.rate);
  const tax = form.tax !== '' && form.tax != null ? parseAmount(form.tax, cur()) : divRound(net * BigInt(rate), 10000n);
  const bill = addRecord({ t: 'bill', id: newId(), number: nextNumber('bill', 'FF-'), supplierId: supplier.id, supplierRef: form.supplierRef || '',
    date: form.date, dueDate: form.dueDate || addDays(form.date, 30), kind: form.kind, taxRateBp: rate,
    net: String(net), tax: String(tax), gross: String(net + tax), paid: '0', payments: [], status: 'booked',
    source: form.source || 'manual', createdAt: new Date().toISOString() });
  const entry = addRecord(postBill(bill, supplier, S.t.pack));
  bill.entryId = entry.id;
  const touched = [];
  if (form.productId && form.qty) {
    const p = byId('product', form.productId);
    const q = parseQty(form.qty);
    p.onHand = String(BigInt(p.onHand || '0') + q);
    bill.stockProductId = p.id; bill.stockQty = String(q);
    p.moves = [{ date: bill.date, qty: String(q), ref: bill.number }, ...(p.moves || [])].slice(0, 2000);
    touched.push(p);
  }
  audit(form.source === 'agent' ? 'Facture fournisseur saisie par l’agent, validée' : 'Facture fournisseur comptabilisée',
        `${bill.number} — ${supplier.name} — ${fmt(bill.gross, cur())}`, form.source === 'agent' ? 'agent' : 'user');
  persist(bill, entry, ...touched); persistMeta();
  return bill;
}

function payBill(id, { amount, method, date }) {
  const bill = byId('bill', id);
  const amt = parseAmount(amount, cur());
  const paid = BigInt(bill.paid || 0) + amt;
  if (amt <= 0n) throw new Error('Le montant doit être positif.');
  if (paid > BigInt(bill.gross)) throw new Error('Le paiement dépasse le reste dû.');
  const supplier = byId('supplier', bill.supplierId);
  const p = { id: newId(), date, amount: String(amt), method };
  const entry = addRecord(postSupplierPayment(bill, p, supplier, S.t.pack));
  p.entryId = entry.id;
  bill.payments = [...(bill.payments || []), p];
  bill.paid = String(paid);
  bill.status = paid === BigInt(bill.gross) ? 'paid' : 'partially_paid';
  audit('Fournisseur payé', `${bill.number} — ${supplier.name} — ${fmt(amt, cur())}`);
  persist(bill, entry); persistMeta();
}

   Ledger analytics
   ========================================================================== */
function trialBalance() {
  const m = new Map();
  for (const e of S.r.entry) for (const l of e.lines) {
    const x = m.get(l.a) || { a: l.a, d: 0n, c: 0n };
    x.d += BigInt(l.d); x.c += BigInt(l.c); m.set(l.a, x);
  }
  return [...m.values()].sort((x, y) => x.a.localeCompare(y.a)).map((x) => ({ ...x, label: pack().chart[x.a] || x.a, bal: x.d - x.c }));
}
function balanceOf(pred) { return trialBalance().filter((x) => pred(x.a)).reduce((s, x) => s + x.bal, 0n); }
function kpis() {
  const a = pack().acc;
  const year = today().slice(0, 4);
  const revenueYear = S.r.entry.filter((e) => e.date.startsWith(year)).flatMap((e) => e.lines)
    .filter((l) => l.a.startsWith('7')).reduce((s, l) => s + BigInt(l.c) - BigInt(l.d), 0n);
  const vatDue = -(balanceOf((x) => x === a.vatC)) - balanceOf((x) => x === a.vatD);
  return {
    revenueYear,
    receivables: balanceOf((x) => x === a.receivable),
    cash: balanceOf((x) => x.startsWith('5')),
    payables: -balanceOf((x) => x === a.payable),
    vatDue,
  };
}
function monthlyRevenue(n = 6) {
  const now = new Date(); const months = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - i, 1));
    months.push({ key: d.toISOString().slice(0, 7), label: d.toLocaleDateString(LOC(), { month: 'short', timeZone: 'UTC' }).replace('.', ''), v: 0n });
  }
  for (const inv of S.r.invoice) {
    if (inv.status === 'draft') continue;
    const m = months.find((x) => x.key === (inv.issueDate || '').slice(0, 7));
    if (m) m.v += BigInt(inv.net);
  }
  return months;
}
function outstandingByCustomer() {
  const m = new Map();
  for (const inv of S.r.invoice) {
    if (!['issued', 'partially_paid'].includes(inv.status)) continue;
    m.set(inv.customerId, (m.get(inv.customerId) || 0n) + invoiceView(inv).due);
  }
  return m;
}

  payInvoice(i3.id, { amount: '700000', method: 'bank_transfer', date: addDays(T, -60), ref: 'VIR-SGBS-5520' });
  payInvoice(i4.id, { amount: amountInput(i4.gross, meta.currency), method: 'mobile_money', date: addDays(T, -45), ref: 'OM-77A3301' });

  void i5; void i6;
  saveInvoice({ customerId: boutique.id, issueDate: T, dueDays: 15, lines: [line(router, 2), line(cable, 40)] }, false);
  const b3 = saveBill({ supplierId: sup2.id, supplierRef: 'SEN-0925-4471', date: addDays(T, -35), kind: 'service', net: '142000', rate: '1800' });
  payBill(S.r.bill[0].id, { amount: amountInput(S.r.bill[0].gross, meta.currency), method: 'bank_transfer', date: addDays(T, -130) });
  payBill(b3.id, { amount: amountInput(b3.gross, meta.currency), method: 'mobile_money', date: addDays(T, -30) });
  meta.audit = [{ at: new Date().toISOString(), actor: 'system', action: 'Entreprise d’exemple créée', detail: 'Données fictives, modifiables librement' }, ...meta.audit];
}

function statusPill(inv) {
  const v = invoiceView(inv);
  if (inv.status === 'draft') return '<span class="pill draft">Brouillon</span>';
  if (inv.status === 'paid') return '<span class="pill paid">Payée</span>';
  if (v.late) return `<span class="pill late">${tf('En retard · {d} j', { d: v.lateDays })}</span>`;
  if (inv.status === 'partially_paid') return '<span class="pill partial">Partiellement payée</span>';
  return '<span class="pill issued">Émise</span>';
}

function viewAccounting() {
  const C = cur();
  const tabs = { journal: 'Journal', balance: 'Balance', tva: 'TVA' };
  let body = '';
  if (S.comptaTab === 'balance') {
    const tb = trialBalance(); const td = sumBig(tb.map((x) => x.d)), tc = sumBig(tb.map((x) => x.c));
    body = `<section class="card"><div class="card-head"><h2>Balance générale</h2>
      <span>${td === tc ? '<span class="pill paid">Équilibrée</span>' : '<span class="pill late">Déséquilibrée</span>'} <button class="btn sm" data-act="copy-balance">Copier (CSV)</button></span></div>

      <tbody>${tb.map((x) => `<tr><td class="mono">${x.a}</td><td>${esc(x.label)}</td><td class="num">${fmt(x.d, C)}</td><td class="num">${fmt(x.c, C)}</td>
        <td class="num">${fmt(x.bal < 0n ? -x.bal : x.bal, C)} <span class="muted small">${x.bal > 0n ? 'D' : x.bal < 0n ? 'C' : ''}</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">Totaux</td><td class="num">${fmt(td, C)}</td><td class="num">${fmt(tc, C)}</td><td></td></tr></tfoot></table></div></section>`;
  } else if (S.comptaTab === 'tva') {
    const a = pack().acc; const byRate = new Map();
    for (const i of S.r.invoice) if (i.status !== 'draft') for (const l of i.lines) {
      const x = byRate.get(l.taxRateBp) || { base: 0n, tax: 0n }; x.base += BigInt(l.net); x.tax += BigInt(l.tax); byRate.set(l.taxRateBp, x);
    }
    const ded = sumBig(S.r.bill.map((b) => b.tax));
    const coll = -balanceOf((x) => x === a.vatC);
    body = `<section class="card"><div class="card-head"><h2>Synthèse de TVA</h2><span class="muted small">Depuis l'ouverture des comptes</span></div>
      <div class="table-wrap"><table><thead><tr><th>Taux</th><th class="num">Base HT</th><th class="num">TVA collectée</th></tr></thead>
      <tbody>${[...byRate.entries()].sort((x, y) => y[0] - x[0]).map(([r, x]) => `<tr><td>${pct(r)}</td><td class="num">${fmt(x.base, C)}</td><td class="num">${fmt(x.tax, C)}</td></tr>`).join('')}
      <tr><td>TVA déductible sur achats</td><td></td><td class="num">− ${fmt(ded, C)}</td></tr></tbody>
      <tfoot><tr><td>${coll - ded >= 0n ? 'TVA nette à reverser' : 'Crédit de TVA'}</td><td></td><td class="num">${fmt(coll - ded >= 0n ? coll - ded : ded - coll, C)}</td></tr></tfoot></table></div></section>`;
  } else {
    const entries = [...S.r.entry].sort((x, y) => y.date.localeCompare(x.date) || y.createdAt.localeCompare(x.createdAt)).slice(0, 60);

function openModal(kind, data = {}) {
  if (SERVER && ['invoice', 'pay', 'bill', 'pay-bill', 'adjust'].includes(kind)) Store.pull().catch(() => {}); // fresh numbers and stock before an action
  S.modal = { kind, data, error: '' }; renderModal(); setTimeout(() => modalRoot.querySelector('input:not([type=hidden]):not([type=file]),select,textarea')?.focus(), 0); }
function closeModal() { S.modal = null; S.draft = null; renderModal(); }
function shell(title, body, foot, wide = false) {
  return `<div class="overlay" data-act="overlay"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="btn ghost sm" data-act="close" aria-label="Fermer">Fermer</button></div>
    <div class="modal-body">${body}${S.modal.error ? `<p class="error-text" role="alert">${esc(S.modal.error)}</p>` : ''}</div>
    ${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div></div>`;
}
const rateOptions = (sel) => COUNTRIES[S.t.country].rates.map((r) => `<option value="${r}" ${String(r) === String(sel) ? 'selected' : ''}>${pct(r)}</option>`).join('');
const methodOptions = (sel) => Object.entries(METHODS)

  const C = S.t ? cur() : 'EUR';
  let html = '';
  if (m.kind === 'tenant') {
    html = shell('Nouvelle entreprise', tenantForm(), '');
  } else if (m.kind === 'stock-settings') {
    const p = byId('product', m.data.id);
    html = shell(tf('Seuils et coût — {name}', { name: p.name }), stockSettingsHtml(p),
      `<button class="btn" data-act="close">Annuler</button><button class="btn primary" type="submit" form="f-stock-settings">Enregistrer</button>`);
  } else if (m.kind === 'demo-cta') {

function businessSnapshot() {

  return {
    entreprise: S.t.name, pays: COUNTRIES[S.t.country].name, devise: C, plan_comptable: pack().label, date_du_jour: today(),

      tresorerie_13_semaines: cf.buckets.map((b, i) => ({ semaine: 'S' + (i + 1), du: b.from, encaissements: fmt(b.inn, C), decaissements: fmt(b.out, C), solde: fmt(b.balance, C) })),
      premiere_semaine_negative: cf.firstNegative != null ? cf.buckets[cf.firstNegative].from : null, charges_recurrentes: fc().charges.map((c) => ({ libelle: c.label, montant: fmt(c.amount, C), jour: c.day })) }; })(),

  };
}

async function askCopilot(question) {
  if (!S.ai || S.chatBusy || !question.trim()) return;
  S.chat.push({ role: 'user', content: question.trim() }, { role: 'assistant', content: 'Réflexion…' });
  S.chatBusy = true; render();
  const idx = S.chat.length - 1;
  const context = `Tu es le copilote financier de la PME ci-dessous. Réponds en ${LANGS[LANG].ai}, de façon brève et concrète (5 à 10 lignes, listes si utile), avec des montants formatés dans la devise de l'entreprise. Appuie-toi uniquement sur les données fournies et sur les outils ; n'invente aucun chiffre. Tu ne peux rien modifier : si une action est utile (relancer, payer, émettre), recommande-la et dis où cliquer (menus : Factures, Achats, Comptabilité).\n\nDonnées de l'entreprise :\n${JSON.stringify(businessSnapshot())}`;
  const msgs = S.chat.slice(0, -1).map((m, i) => ({ role: m.role, content: i === 0 ? context + '\n\nQuestion : ' + m.content : m.content }));
  try {
    const res = await S.ai(msgs, { tools: aiTools(), modelTier: 'default', cache: false,
      onText: ({ text }) => { S.chat[idx].content = text; const el = document.getElementById('msg-' + idx); if (el) el.textContent = text; } });
    S.chat[idx].content = res.text || S.chat[idx].content;
  } catch (e) {
    S.chat[idx].content = e && e.code === 'rate_limited' ? 'Trop de demandes pour le moment : réessayez dans une minute.'
      : e && e.code === 'not_granted' ? "Le copilote n'a pas été autorisé dans cette vue." : 'Le copilote n’a pas pu répondre. Réessayez.';
    if (e && e.code === 'not_granted') S.ai = null;
  }
  S.chatBusy = false; render();
  const log = document.getElementById('chat-log'); if (log) log.scrollTop = log.scrollHeight;
  document.getElementById('chat-input')?.focus();
}

/* ============================================================================
   Forecasts: sales targets vs actual, and a 13-week cash forecast.
   Everything is derived from the books and documents at render time; only the
   person's assumptions (targets, recurring charges, collection delay) are stored.
   ========================================================================== */
function fc() {
  if (!S.t.forecast) {
    S.t.forecast = { targets: {}, charges: [], lateWeeks: 2, vat: true, futureSales: false };
    if (S.t.demo) { // sample assumptions so the example company opens with a filled forecast
      const y = today().slice(0, 4);
      for (let m = 1; m <= 12; m++) S.t.forecast.targets[`${y}-${String(m).padStart(2, '0')}`] = '700000';
      S.t.forecast.charges = [
        { id: newId(), label: 'Loyer des bureaux', amount: '150000', day: 5 },
        { id: newId(), label: 'Salaires', amount: '420000', day: 28 },
        { id: newId(), label: 'Internet et téléphone', amount: '25000', day: 10 },
      ];
    }
  }
  return S.t.forecast;
}
const monthKey = (iso) => iso.slice(0, 7);
function shiftMonth(key, n) { const [y, m] = key.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); return d.toISOString().slice(0, 7); }
const daysInMonth = (key) => { const [y, m] = key.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const monthLabel = (key, opts = { month: 'short' }) => new Date(key + '-01T00:00:00Z').toLocaleDateString(LOC(), { ...opts, timeZone: 'UTC' }).replace('.', '');

function netByMonth() {
  const m = new Map();
  for (const inv of S.r.invoice) {
    if (inv.status === 'draft' || !inv.issueDate) continue;
    const k = monthKey(inv.issueDate);
    m.set(k, (m.get(k) || 0n) + BigInt(inv.net));
  }
  return m;
}

/** Sales of a calendar year: target, actual and projection per month. */
function salesForecast(year = Number(today().slice(0, 4))) {
  const f = fc(), T = today(), curKey = monthKey(T), byMonth = netByMonth();
  const prev = [1, 2, 3].map((k) => byMonth.get(shiftMonth(curKey, -k)) || 0n);
  const avg3 = prev.reduce((s, v) => s + v, 0n) / 3n;
  const months = Array.from({ length: 12 }, (_, i) => {
    const key = `${year}-${String(i + 1).padStart(2, '0')}`;
    const target = f.targets[key] != null && f.targets[key] !== '' ? BigInt(f.targets[key]) : null;
    const actual = byMonth.get(key) || 0n;
    const phase = key < curKey ? 'past' : key === curKey ? 'current' : 'future';
    let projection = actual, basis = 'réalisé';
    if (phase === 'current') {
      const day = Number(T.slice(8, 10)), dim = daysInMonth(key);
      const runRate = divRound(actual * BigInt(dim), BigInt(day));
      projection = runRate > actual ? runRate : actual; basis = 'rythme du mois';
    } else if (phase === 'future') {
      projection = target ?? avg3; basis = target != null ? 'objectif' : 'moyenne 3 mois';
    }
    return { key, label: monthLabel(key), target, actual, phase, projection, basis,
      gap: target != null && phase !== 'future' ? actual - target : null,
      rate: target ? Number((actual * 1000n) / target) / 10 : null };
  });
  const sum = (sel) => months.reduce((s, m) => s + sel(m), 0n);
  const targetYear = months.some((m) => m.target != null) ? sum((m) => m.target ?? 0n) : null;
  return { year, months, avg3, actualYtd: sum((m) => m.actual), projectionYear: sum((m) => m.projection), targetYear };
}

/** Weekly cash forecast from today: open invoices, unpaid bills, recurring charges, VAT. */
function cashForecast(weeks = 13) {
  const f = fc(), start = today(), C = cur();
  const buckets = Array.from({ length: weeks }, (_, i) => ({ from: addDays(start, 7 * i), to: addDays(start, 7 * i + 6), inn: 0n, out: 0n, items: [] }));
  const at = (date) => { const i = Math.floor(daysBetween(start, date) / 7); return i >= 0 && i < weeks ? buckets[i] : null; };
  let beyond = 0n, uncollected = 0n;
  for (const inv of S.r.invoice) {
    if (!['issued', 'partially_paid'].includes(inv.status)) continue;
    const due = invoiceView(inv).due; if (due <= 0n) continue;
    const late = inv.dueDate < start;
    if (late && f.lateWeeks < 0) { uncollected += due; continue; } // assumption: late invoices are not counted
    const date = late ? addDays(start, 7 * f.lateWeeks) : inv.dueDate;
    const b = at(date);
    if (b) { b.inn += due; b.items.push({ dir: 'in', label: `${inv.number} ${byId('customer', inv.customerId)?.name || ''}${late ? ' (en retard)' : ''}`, amount: due }); }
    else beyond += due;
  }
  for (const bill of S.r.bill) {
    const rest = BigInt(bill.gross) - BigInt(bill.paid); if (rest <= 0n) continue;
    const b = at(bill.dueDate < start ? start : bill.dueDate);
    if (b) { b.out += rest; b.items.push({ dir: 'out', label: `${byId('supplier', bill.supplierId)?.name || 'Fournisseur'} ${bill.supplierRef || bill.number}`, amount: rest }); }
  }
  for (const ch of f.charges) {
    for (const b of buckets) {
      for (let d = b.from; d <= b.to; d = addDays(d, 1)) {
        const day = Math.min(ch.day, daysInMonth(monthKey(d)));
        if (Number(d.slice(8, 10)) === day) { const amt = BigInt(ch.amount); b.out += amt; b.items.push({ dir: 'out', label: ch.label, amount: amt }); }
      }
    }
  }
  let plannedIn = 0n;
  if (f.futureSales) {
    const rate = BigInt(COUNTRIES[S.t.country].rates[0]);
    for (const m of salesForecast().months) {
      if (m.phase === 'past') continue;
      const net = m.phase === 'current' ? (m.projection > m.actual ? m.projection - m.actual : 0n) : m.projection;
      if (net <= 0n) continue;
      const gross = net + divRound(net * rate, 10000n);
      const mid = m.key + '-15', base = m.phase === 'current' && mid < start ? start : mid;
      const b = at(addDays(base, 30));
      if (b) { b.inn += gross; plannedIn += gross; b.items.push({ dir: 'in', label: tf('Ventes prévues {m}', { m: monthLabel(m.key, { month: 'long' }) }), amount: gross }); }
    }
  }
  const vatDue = kpis().vatDue;
  if (f.vat && vatDue > 0n) {
    const due15 = Number(start.slice(8, 10)) < 15 ? start.slice(0, 8) + '15' : shiftMonth(monthKey(start), 1) + '-15';
    const b = at(due15);
    if (b) { b.out += vatDue; b.items.push({ dir: 'out', label: 'TVA à reverser', amount: vatDue }); }
  }
  const opening = kpis().cash;
  let bal = opening, min = { balance: opening, week: null }, firstNegative = null;
  for (const [i, b] of buckets.entries()) {
    bal += b.inn - b.out; b.balance = bal;
    if (bal < min.balance) min = { balance: bal, week: i };
    if (bal < 0n && firstNegative == null) firstNegative = i;
  }
  return { opening, buckets, min, firstNegative, beyond, uncollected, plannedIn, closing: bal,
    totalIn: buckets.reduce((s, b) => s + b.inn, 0n), totalOut: buckets.reduce((s, b) => s + b.out, 0n), currency: C };
}

function compactMoney(v, C) {
  const units = Number(v) / 10 ** minorOf(C), a = Math.abs(units);
  const t = a >= 1e6 ? (units / 1e6).toLocaleString(LOC(), { maximumFractionDigits: 1 }) + ' M' : a >= 1e3 ? (units / 1e3).toLocaleString(LOC(), { maximumFractionDigits: 0 }) + ' k' : units.toLocaleString(LOC(), { maximumFractionDigits: 0 });
  return t;
}

function salesChart(sf, C) {
  const W = 640, H = 220, padL = 46, padB = 26, padT = 14, bw = (W - padL - 6) / 12;
  const max = sf.months.reduce((m, x) => [x.actual, x.target ?? 0n, x.phase !== 'past' ? x.projection : 0n].reduce((a, b) => (b > a ? b : a), m), 0n) || 1n;
  const y = (v) => H - padB - Number((v * 10000n) / max) / 10000 * (H - padB - padT);
  const ticks = [0, 0.5, 1].map((r) => { const v = BigInt(Math.round(Number(max) * r)); return `<line class="grid" x1="${padL}" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${compactMoney(v, C)}</text>`; }).join('');
  const bars = sf.months.map((m, i) => {
    const x = padL + i * bw + bw * 0.2, w = bw * 0.6;
    const proj = m.phase !== 'past' && m.projection > m.actual ? `<rect class="bar proj" x="${x.toFixed(1)}" y="${y(m.projection).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(m.actual) - y(m.projection)).toFixed(1)}" rx="2"><title>${m.label} : ${tr('projection')} ${fmt(m.projection, C)} (${tr(m.basis)})</title></rect>` : '';
    const act = m.actual > 0n ? `<rect class="bar ${m.target != null && m.phase === 'past' && m.actual < m.target ? 'below' : ''}" x="${x.toFixed(1)}" y="${y(m.actual).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - padB - y(m.actual)).toFixed(1)}" rx="2"><title>${m.label} : ${tr('réalisé')} ${fmt(m.actual, C)}</title></rect>` : '';
    const tgt = m.target != null ? `<line class="target" x1="${(x - 3).toFixed(1)}" x2="${(x + w + 3).toFixed(1)}" y1="${y(m.target).toFixed(1)}" y2="${y(m.target).toFixed(1)}"><title>${m.label} : ${tr('objectif')} ${fmt(m.target, C)}</title></line>` : '';
    return `${proj}${act}${tgt}<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" ${m.phase === 'current' ? 'class="now"' : ''}>${m.label}</text>`;
  }).join('');
  return `<svg class="bars fc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tf('Ventes HT {y} : réalisé, projection et objectif par mois', { y: sf.year })}">${ticks}${bars}</svg>
    <div class="legend"><span><i class="sw act"></i>Réalisé</span><span><i class="sw proj"></i>Projection</span><span><i class="sw tgt"></i>Objectif</span><span><i class="sw below"></i>Mois passé sous l'objectif</span></div>`;
}

function cashChart(cf, C) {
  const W = 640, H = 220, padL = 52, padB = 26, padT = 14;
  const vals = [cf.opening, ...cf.buckets.map((b) => b.balance)];
  let max = vals.reduce((m, v) => (v > m ? v : m), 0n), min = vals.reduce((m, v) => (v < m ? v : m), 0n);
  if (max === min) max = min + 1n;
  const span = max - min;
  const x = (i) => padL + (i * (W - padL - 10)) / (vals.length - 1);
  const y = (v) => padT + Number(((max - v) * 10000n) / span) / 10000 * (H - padT - padB);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area = `M${x(0).toFixed(1)},${y(0n).toFixed(1)} L${pts.join(' L')} L${x(vals.length - 1).toFixed(1)},${y(0n).toFixed(1)} Z`;
  const labels = vals.map((v, i) => (i % 2 === 0 || i === vals.length - 1) ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${i === 0 ? tr('Auj.') : tf('S{n}', { n: i })}</text>` : '').join('');
  const minI = vals.findIndex((v) => v === vals.reduce((m, w) => (w < m ? w : m), vals[0]));
  return `<svg class="bars fc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Solde de trésorerie projeté sur 13 semaines">
    <line class="grid" x1="${padL}" x2="${W}" y1="${y(max).toFixed(1)}" y2="${y(max).toFixed(1)}"/><text x="${padL - 6}" y="${(y(max) + 4).toFixed(1)}" text-anchor="end">${compactMoney(max, C)}</text>
    <line class="zero" x1="${padL}" x2="${W}" y1="${y(0n).toFixed(1)}" y2="${y(0n).toFixed(1)}"/><text x="${padL - 6}" y="${(y(0n) + 4).toFixed(1)}" text-anchor="end">0</text>
    ${min < 0n ? `<text x="${padL - 6}" y="${(y(min) + 4).toFixed(1)}" text-anchor="end">${compactMoney(min, C)}</text>` : ''}
    <path class="area ${min < 0n ? 'neg' : ''}" d="${area}"/><polyline class="cash-line" points="${pts.join(' ')}"/>
    ${vals.map((v, i) => `<circle class="pt ${v < 0n ? 'neg' : ''}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === minI ? 4.5 : 2.5}"><title>${i === 0 ? tr('Aujourd’hui') : tf('Fin semaine {n}', { n: i })} : ${fmt(v, C)}</title></circle>`).join('')}
    ${labels}</svg>`;
}

      <tbody>${sf.months.map((m) => `<tr${m.phase === 'current' ? ' class="current-row"' : ''}><td>${monthLabel(m.key, { month: 'long' })}${m.phase === 'current' ? ' <span class="pill issued">en cours</span>' : ''}</td>
        <td class="num"><input class="target-input" type="text" inputmode="decimal" aria-label="${tf('Objectif {m}', { m: monthLabel(m.key, { month: 'long' }) })}" data-change="fc-target" data-month="${m.key}" value="${m.target != null ? amountInput(m.target, C) : ''}" placeholder="—"></td>

          ${f.charges.length ? `<tfoot><tr><td>Total mensuel</td><td></td><td class="num">${fmt(f.charges.reduce((s, ch) => s + BigInt(ch.amount), 0n), C)}</td><td></td></tr></tfoot>` : ''}</table></div>
        <form class="row" data-form="charge" style="align-items:end">

}

  ];

function cashAlertCount() { try { return cashForecast().firstNegative != null ? 'alerte' : ''; } catch { return ''; } }

/* ============================================================================
   Files: ZIP, Excel (.xlsx), Word (.docx) and PDF, written and read without
   any library, so every byte is ours and testable.
   ========================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;

function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

const normHeader = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9%]+/g, ' ').trim();

async function readImportFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.csv') || name.endsWith('.txt')) return readCsvRows(await file.text());
  if (name.endsWith('.xlsx') || name.endsWith('.xlsm')) return readXlsxRows(await file.arrayBuffer());
  if (name.endsWith('.docx')) return readDocxRows(await file.arrayBuffer());
  if (name.endsWith('.xls') || name.endsWith('.doc')) throw new Error('Ancien format Office : ouvrez le fichier et enregistrez-le en .xlsx ou .docx, puis réessayez.');
  throw new Error('Format non reconnu : utilisez un fichier .xlsx, .csv ou .docx.');
}

function numericCell(s) { return /^-?\d+(\.\d+)?(e-?\d+)?$/i.test(String(s).trim()); }
function cellAmount(s) {
  const t = String(s ?? '').trim();
  if (!t) throw new Error('prix manquant');
  return parseAmount(numericCell(t) ? Number(t).toFixed(minorOf(cur())) : t.replace(/[^\d,.\s]/g, ''), cur());
}
function cellRate(s) {
  const rates = COUNTRIES[S.t.country].rates;
  const t = String(s ?? '').trim().replace('%', '').replace(',', '.');
  if (!t) return rates[0];
  let x = Number(t);
  if (!Number.isFinite(x)) throw new Error(tf('taux de TVA illisible « {v} »', { v: s }));
  if (x > 0 && x < 1) x *= 100;
  const bp = Math.round(x * 100);
  if (!rates.includes(bp)) throw new Error(tf('taux {rate} non prévu pour {country} ({rates})', { rate: pct(bp), country: tr(COUNTRIES[S.t.country].name), rates: rates.map(pct).join(', ') }));
  return bp;
}

/** Turns raw rows into validated records, without saving anything. */
function analyseImport(type, rows) {
  const def = IMPORT_FIELDS[type];
  if (!rows.length) throw new Error('Le fichier est vide.');
  const headers = rows[0].map(normHeader);
  const map = {};
  for (const f of def.fields) {
    const idx = headers.findIndex((h) => f.syn.includes(h)) >= 0 ? headers.findIndex((h) => f.syn.includes(h)) : headers.findIndex((h) => f.syn.some((s) => h.startsWith(s)));
    if (idx >= 0) map[f.key] = idx;
  }
  const missing = def.fields.filter((f) => f.req && map[f.key] == null);
  if (missing.length) throw new Error(tf('Colonne obligatoire introuvable : {cols}. La première ligne doit contenir les intitulés (téléchargez le modèle).', { cols: missing.map((f) => '« ' + tr(f.label) + ' »').join(', ') }));
  const existing = new Set(S.r[type].map((r) => normName(r.name)));
  const seen = new Set();
  const items = rows.slice(1).map((r, i) => ({ r, line: i + 2 })).filter(({ r }) => r.some((c) => String(c ?? '').trim())).map(({ r, line }) => {
    const get = (k) => (map[k] == null ? '' : String(r[map[k]] ?? '').trim());
    const item = { line, values: Object.fromEntries(def.fields.map((f) => [f.key, get(f.key)])), status: 'ok', note: '' };
    try {
      if (!item.values.name) throw new Error('nom manquant');
      const key = normName(item.values.name);
      if (existing.has(key)) { item.status = 'skip'; item.note = 'existe déjà'; return item; }
      if (seen.has(key)) { item.status = 'skip'; item.note = 'doublon dans le fichier'; return item; }
      seen.add(key);
      if (item.values.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(item.values.email)) throw new Error('e-mail invalide');
      if (type === 'product') {
        const kind = /march|bien|good|produit|article|stock/.test(normHeader(item.values.kind)) ? 'goods' : 'service';
        const stockText = item.values.stock;
        item.record = { t: 'product', id: newId(), name: item.values.name, kind, unitPrice: String(cellAmount(item.values.price)), taxRateBp: cellRate(item.values.rate),
          trackStock: kind === 'goods', onHand: kind === 'goods' && stockText && Number(String(stockText).replace(',', '.')) > 0 ? String(parseQty(numericCell(stockText) ? String(Math.round(Number(stockText) * 1000) / 1000) : stockText)) : '0', moves: [], createdAt: new Date().toISOString() };
        if (BigInt(item.record.onHand) > 0n) item.record.moves = [{ date: today(), qty: item.record.onHand, ref: 'Import' }];
      } else {
        item.record = { t: type, id: newId(), name: item.values.name, email: item.values.email, phone: item.values.phone, taxId: item.values.taxId, createdAt: new Date().toISOString() };
      }
    } catch (e) { item.status = 'error'; item.note = e.message; }
    return item;
  });
  return { type, map, items, ok: items.filter((x) => x.status === 'ok').length };
}

function applyImport(analysis) {
  const recs = analysis.items.filter((x) => x.status === 'ok').map((x) => addRecord(x.record));
  audit(`Import : ${recs.length} ${IMPORT_FIELDS[analysis.type].label.toLowerCase()}`, analysis.fileName || '');
  persist(...recs); persistMeta();
  return recs.length;
}

/* ============================================================================
   Delivering files to the viewer
   ========================================================================== */
async function offerFile(filename, bytesOrPromise) {
  let bytes;
  try { bytes = await bytesOrPromise; } catch (e) { toast(e.message || 'Le fichier n’a pas pu être créé.', true); return; }
  const blob = new Blob([bytes]);
  if (S.downloads) {
    try { await S.downloads.save({ filename, data: blob }); toast(tf('{f} enregistré.', { f: filename })); }
    catch (e) {
      if (e?.code === 'declined') return;
      if (e?.code === 'rate_limited') toast('Une demande de téléchargement est déjà ouverte : répondez-y d’abord.', true);
      else if (e?.code === 'extension_not_enabled' || e?.code === 'rejected_extension') toast('Ce format n’est pas disponible ici.', true);
      else toast('Le téléchargement n’a pas pu se faire. Réessayez.', true);
    }
    return;
  }
  if (!(window.claude && window.claude.use)) {
    // Outside claude.ai (local preview): plain browser download.
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return;
  }
  toast('Le téléchargement n’est pas disponible dans cette vue : ouvrez la page sur claude.ai.', true);
}

function exportFile(kind, id) {
  const base = safeName(S.t.name) + '_';
  try {
    switch (kind) {
      case 'workbook': return offerFile(`${base}classeur_${fileStamp()}.xlsx`, workbookXlsx());
      case 'stock-xlsx': return offerFile(`${base}stock-marges_${fileStamp()}.xlsx`, stockXlsx());
      case 'activity-docx': return offerFile(`${base}rapport-activite_${fileStamp()}.docx`, activityReportDocx());
      case 'balance-pdf': case 'journal-pdf': case 'tva-pdf': case 'invoices-pdf': {
        const k = kind.replace('-pdf', '');
        return offerFile(`${base}${{ balance: 'balance', journal: 'journal', tva: 'tva', invoices: 'factures' }[k]}_${fileStamp()}.pdf`, reportPdf(k));
      }
      case 'invoice-pdf': { const inv = byId('invoice', id); return offerFile(`Facture_${inv.number || 'brouillon'}_${safeName(byId('customer', inv.customerId).name)}.pdf`, invoicePdf(inv)); }
      case 'invoice-docx': { const inv = byId('invoice', id); return offerFile(`Facture_${inv.number || 'brouillon'}_${safeName(byId('customer', inv.customerId).name)}.docx`, invoiceDocx(inv)); }
      case 'reminder-docx': { const inv = byId('invoice', id); return offerFile(`Relance_${inv.number}_${safeName(byId('customer', inv.customerId).name)}.docx`, reminderDocx(inv, document.getElementById('r-text')?.value || '')); }
      case 'template': return offerFile(`modele-import_${safeName(IMPORT_FIELDS[id].label.toLowerCase())}.xlsx`, templateXlsx(id));
    }
  } catch (e) { toast(e.message || 'Le fichier n’a pas pu être créé.', true); }

   PDF supplier invoices: page 1 rendered to an image for the reading agent
   ========================================================================== */
let pdfjsReady = null;
function loadScript(src) {
  return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('script')); document.head.appendChild(s); });
}
async function pdfFirstPageImage(file) {
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  pdfjsReady ||= (async () => {
    await loadScript(base + 'pdf.min.js');
    await loadScript(base + 'pdf.worker.min.js'); // lets pdf.js run on the page if a worker cannot start
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
  })();
  try { await pdfjsReady; } catch (e) { pdfjsReady = null; throw new Error('Le lecteur PDF n’a pas pu se charger.'); }
  const doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const page = await doc.getPage(1);
  const viewport = page.getViewport({ scale: 2 });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
}
