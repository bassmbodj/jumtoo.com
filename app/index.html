/* ============================================================================
   Stock & margins: perpetual inventory valued at weighted average cost (CMP),
   reorder suggestions, cost of goods sold per invoice line, margins by product,
   customer and month, cost structure, break-even and a price simulator.
   Everything is derived from the records (bills, issued invoices, stock moves),
   so existing companies get valuations without any migration.
   ========================================================================== */
const STOCK_DEFAULT_MIN = 3000n; // 3 units, in thousandths
const DEFAULT_MARGIN_TARGET_BP = 3000;
const STOCK_DORMANT_DAYS = 90;
const minQty = (p) => (p.minQty != null && p.minQty !== '' ? BigInt(p.minQty) : STOCK_DEFAULT_MIN);
const marginTarget = () => (S.t.marginTargetBp != null ? Number(S.t.marginTargetBp) : DEFAULT_MARGIN_TARGET_BP);
const absBig = (v) => (v < 0n ? -v : v);
/** a × b / c, rounded half away from zero (signed). */
function mulDiv(a, b, c) { return c === 0n ? 0n : divRound(a * b, c); }
/** Cost of `qty` thousandths at a unit cost given as value/qty (both in base units). */
const valueAt = (qty, unit) => (unit && unit.q !== 0n ? mulDiv(qty, unit.v, unit.q) : 0n);
const unitPerOne = (unit) => (unit && unit.q !== 0n ? mulDiv(unit.v, 1000n, unit.q) : null); // minor units per 1 unit
const rateBp = (part, whole) => (whole === 0n ? null : Number(mulDiv(part, 10000n, whole)));
const fmtRate = (bp) => (bp == null ? '—' : pct(bp));

S.stock = { tab: 'etat', product: '', period: '12m', sim: { productId: '', target: '' } };

const LEDGER_CACHE = { key: null, map: null };
function ledgerKey() {
  return S.t.id + '|' + S.r.product.map((p) => p.id + ':' + p.onHand + ':' + (p.moves || []).length + ':' + (p.unitCost || '')).join(',') + '|' + S.r.bill.length + '|' + S.r.invoice.length;
}
function ledgers() {
  const key = ledgerKey();
  if (LEDGER_CACHE.key === key) return LEDGER_CACHE.map;
  const billsByNumber = new Map(S.r.bill.map((b) => [b.number, b]));
  const invByNumber = new Map(S.r.invoice.filter((i) => i.number).map((i) => [i.number, i]));
  const map = new Map(S.r.product.filter((p) => p.trackStock).map((p) => [p.id, stockLedger(p, billsByNumber, invByNumber)]));
  LEDGER_CACHE.key = key; LEDGER_CACHE.map = map;
  return map;
}

/** Replays a product's moves oldest first and values each one at weighted average cost. */
function stockLedger(p, billsByNumber, invByNumber) {
  const raw = [...(p.moves || [])].reverse().map((m, seq) => ({ ...m, seq, qty: BigInt(m.qty) }))
    .sort((a, b) => (a.date === b.date ? a.seq - b.seq : a.date < b.date ? -1 : 1));
  const known = raw.reduce((s, m) => s + m.qty, 0n);
  const openQty = BigInt(p.onHand || 0) - known;
  const std = p.unitCost != null && p.unitCost !== '' ? { v: BigInt(p.unitCost), q: 1000n } : null;
  const classify = (m) => {
    const bill = billsByNumber.get(m.ref);
    if (bill && m.qty > 0n) return { kind: 'in', bill };
    const inv = invByNumber.get(m.ref);
    if (inv && m.qty < 0n) return { kind: 'out', inv };
    if (m.ref === 'Stock initial') return { kind: 'open' };
    return { kind: 'adj' };
  };
  const moves = raw.map((m) => ({ ...m, ...classify(m) }));
  const firstIn = moves.find((m) => m.kind === 'in');
  const firstInUnit = firstIn ? { v: BigInt(firstIn.bill.net), q: firstIn.qty } : null;
  if (openQty !== 0n) moves.unshift({ date: (p.createdAt || today()).slice(0, 10), ref: 'Stock d’ouverture', qty: openQty, kind: 'open', seq: -1 });
  let Q = 0n, V = 0n, last = std || firstInUnit;
  const out = [], costByRef = new Map();
  for (const m of moves) {
    let value;
    if (m.kind === 'in') value = BigInt(m.bill.net);
    else if (m.qty > 0n) value = valueAt(m.qty, Q > 0n ? { v: V, q: Q } : std || last || firstInUnit);
    else value = -valueAt(-m.qty, Q > 0n ? { v: V, q: Q } : last || std);
    Q += m.qty; V += value;
    if (Q === 0n) V = 0n; // no residual value without stock
    if (Q > 0n) last = { v: V, q: Q };
    else if (m.qty > 0n && m.qty !== 0n) last = { v: value, q: m.qty };
    if (m.kind === 'out') {
      const k = m.ref + '|' + p.id;
      costByRef.set(k, [...(costByRef.get(k) || []), -value]);
    }
    out.push({ date: m.date, ref: m.ref, kind: m.kind, qty: m.qty, value, unit: m.qty !== 0n ? mulDiv(absBig(value), 1000n, absBig(m.qty)) : 0n, balQty: Q, balValue: V,
      partner: m.bill ? byId('supplier', m.bill.supplierId)?.name : m.inv ? byId('customer', m.inv.customerId)?.name : '' });
  }
  const unit = Q > 0n ? { v: V, q: Q } : last || std;
  return { moves: out, qty: Q, value: Q > 0n ? V : 0n, unit, unitCost: unitPerOne(unit), costByRef, lastIn: [...out].reverse().find((m) => m.kind === 'in') };
}

/** Status, cover and reorder suggestion for one stocked product. */
function stockRow(p) {
  const L = ledgers().get(p.id);
  const since = addDays(today(), -STOCK_DORMANT_DAYS);
  const out90 = L.moves.filter((m) => m.kind === 'out' && m.date >= since).reduce((s, m) => s - m.qty, 0n);
  const lastOut = [...L.moves].reverse().find((m) => m.kind === 'out');
  const min = minQty(p);
  const daily = Number(out90) / STOCK_DORMANT_DAYS; // thousandths per day
  const cover = daily > 0 && L.qty > 0n ? Math.floor(Number(L.qty) / daily) : null;
  let status = 'ok';
  if (L.qty <= 0n) status = 'out';
  else if (L.qty <= min) status = 'low';
  else if (!lastOut || lastOut.date < since) status = 'dormant';
  let suggest = 0n;
  if (status === 'out' || status === 'low') {
    const target = p.reorderQty ? BigInt(p.reorderQty) : (() => { const a = min * 2n - L.qty, b = out90 / 3n - L.qty + min; return a > b ? a : b; })();
    suggest = target > 0n ? ((target + 999n) / 1000n) * 1000n : 1000n;
  }
  return { p, L, out90, cover, status, min, suggest, lastOut };
}
const STOCK_STATUS = { out: ['Rupture', 'late'], low: ['Sous le seuil', 'partial'], dormant: ['Dormant', 'draft'], ok: ['Disponible', 'paid'] };
const stockPill = (st) => `<span class="pill ${STOCK_STATUS[st][1]}">${tr(STOCK_STATUS[st][0])}</span>`;
function stockAlertCount() {
  if (!S.t || !S.r) return '';
  try { const n = S.r.product.filter((p) => p.trackStock).map(stockRow).filter((r) => r.status === 'out' || r.status === 'low').length; return n ? String(n) : ''; } catch { return ''; }
}

/* ------------------------------------------------------------ margins --- */
const MARGIN_PERIODS = { '30j': '30 jours', '90j': '90 jours', '12m': '12 mois', ytd: 'Année en cours', all: 'Tout' };
function periodRange(k) {
  const T = today();
  if (k === '30j') return [addDays(T, -29), T];
  if (k === '90j') return [addDays(T, -89), T];
  if (k === '12m') return [addDays(T, -364), T];
  if (k === 'ytd') return [T.slice(0, 4) + '-01-01', T];
  return ['0000-01-01', '9999-12-31'];
}
/** One row per issued invoice line in the period, with its cost of sale. */
function marginLines(from, to) {
  const L = ledgers();
  const used = new Map();
  const rows = [];
  for (const inv of S.r.invoice) {
    if (!inv.number || inv.status === 'draft' || inv.status === 'cancelled') continue;
    const inPeriod = inv.issueDate >= from && inv.issueDate <= to;
    for (const l of inv.lines) {
      const p = l.productId ? byId('product', l.productId) : null;
      const qty = BigInt(l.qty), revenue = BigInt(l.net);
      let cost = 0n, costed = false;
      if (p && p.trackStock && L.has(p.id)) {
        const k = inv.number + '|' + p.id, i = used.get(k) || 0;
        const c = (L.get(p.id).costByRef.get(k) || [])[i];
        used.set(k, i + 1);
        if (c != null) { cost = c; costed = true; }
      } else if (p && p.unitCost != null && p.unitCost !== '') { cost = mulDiv(qty, BigInt(p.unitCost), 1000n); costed = true; }
      if (inPeriod) rows.push({ date: inv.issueDate, inv, customerId: inv.customerId, productId: p ? p.id : null, label: p ? p.name : l.description, kind: p ? p.kind : l.kind || 'service', qty, revenue, cost, costed });
    }
  }
  return rows;
}
function groupMargins(rows, keyOf, labelOf) {
  const m = new Map();
  for (const r of rows) {
    const k = keyOf(r);
    const g = m.get(k) || { key: k, label: labelOf(r), qty: 0n, revenue: 0n, cost: 0n, uncosted: 0, n: 0 };
    g.qty += r.qty; g.revenue += r.revenue; g.cost += r.cost; g.n += 1; if (!r.costed) g.uncosted += 1;
    m.set(k, g);
  }
  return [...m.values()].map((g) => ({ ...g, margin: g.revenue - g.cost, rate: rateBp(g.revenue - g.cost, g.revenue) }))
    .sort((a, b) => (b.margin > a.margin ? 1 : b.margin < a.margin ? -1 : 0));
}
function monthKeys(from, to, max = 12) {
  const out = []; const end = to > today() ? today() : to;
  let d = new Date(end.slice(0, 7) + '-01T00:00:00Z');
  const start = from < '1900' ? null : from.slice(0, 7);
  while (out.length < max) {
    const k = d.toISOString().slice(0, 7);
    if (start && k < start) break;
    out.unshift(k); d.setUTCMonth(d.getUTCMonth() - 1);
  }
  return out;
}
/** Drops empty months at the start of a series (keeps at least the last one). */
function trimLeading(list, has) { const i = list.findIndex(has); return i < 0 ? list.slice(-1) : list.slice(i); }
const stockMonthLabel = (k) => new Date(k + '-01T00:00:00Z').toLocaleDateString(LOC(), { month: 'short', year: '2-digit', timeZone: 'UTC' });

/** Monthly cost structure: sales, cost of goods, direct service costs, external charges. */
function costStructure(from, to) {
  const rows = marginLines(from, to);
  const months = monthKeys(from, to, S.stock.period === 'all' ? 24 : 12);
  const blank = () => ({ revenue: 0n, cogs: 0n, direct: 0n, charges: 0n });
  const byM = new Map(months.map((k) => [k, blank()]));
  for (const r of rows) { const g = byM.get(r.date.slice(0, 7)); if (!g) continue; g.revenue += r.revenue; if (r.kind === 'goods') g.cogs += r.cost; else g.direct += r.cost; }
  const chargesBySupplier = new Map();
  for (const b of S.r.bill) {
    if (b.kind === 'goods' || b.date < from || b.date > to) continue;
    const g = byM.get(b.date.slice(0, 7)); if (g) g.charges += BigInt(b.net);
    const s = byId('supplier', b.supplierId)?.name || '—';
    chargesBySupplier.set(s, (chargesBySupplier.get(s) || 0n) + BigInt(b.net));
  }
  const list = trimLeading(months.map((k) => { const g = byM.get(k); const gm = g.revenue - g.cogs - g.direct; return { k, ...g, gross: gm, result: gm - g.charges, rate: rateBp(gm, g.revenue) }; }), (g) => g.revenue !== 0n || g.charges !== 0n);
  const tot = list.reduce((a, g) => ({ revenue: a.revenue + g.revenue, cogs: a.cogs + g.cogs, direct: a.direct + g.direct, charges: a.charges + g.charges }), blank());
  tot.gross = tot.revenue - tot.cogs - tot.direct; tot.result = tot.gross - tot.charges; tot.rate = rateBp(tot.gross, tot.revenue);
  const active = list.filter((g) => g.revenue !== 0n || g.charges !== 0n).length || 1;
  const recurring = (S.t.forecast && S.t.forecast.charges ? S.t.forecast.charges : []).reduce((s, c) => s + BigInt(c.amount), 0n);
  const fixedMonthly = recurring > 0n ? recurring : tot.charges / BigInt(active);
  const breakEven = tot.rate && tot.rate > 0 ? mulDiv(fixedMonthly, 10000n, BigInt(tot.rate)) : null;
  const avgRevenue = tot.revenue / BigInt(active);
  const suppliers = [...chargesBySupplier.entries()].map(([name, v]) => ({ name, v })).sort((a, b) => (b.v > a.v ? 1 : -1));
  return { list, tot, fixedMonthly, fixedSource: recurring > 0n ? 'forecast' : 'bills', breakEven, avgRevenue, suppliers, active };
}

/* --------------------------------------------------------------- views --- */
function viewStock() {
  const tabs = [['etat', 'État du stock', stockAlertCount()], ['mouvements', 'Mouvements'], ['marges', 'Marges'], ['couts', 'Analyse des coûts']];
  let body = '';
  if (S.stock.tab === 'etat') body = stockTabState();
  else if (S.stock.tab === 'mouvements') body = stockTabMoves();
  else if (S.stock.tab === 'marges') body = stockTabMargins();
  else body = stockTabCosts();
  return `<div class="page-head"><div><h1>Stock et marges</h1><p>Valorisation au coût moyen pondéré, réapprovisionnement, coûts de revient et marges.</p></div>
      <div class="actions"><button class="btn" data-act="export" data-kind="stock-xlsx">Exporter (Excel)</button></div></div>
    <div class="chips" role="tablist" aria-label="Stock et marges">${tabs.map(([k, l, n]) => `<button class="chip" role="tab" data-act="stock-tab" data-tab="${k}" aria-pressed="${S.stock.tab === k}">${l}${n ? ` <span class="badge">${n}</span>` : ''}</button>`).join('')}</div>
    ${body}`;
}

function stockTabState() {
  const C = cur();
  const rows = S.r.product.filter((p) => p.trackStock).map(stockRow);
  const order = { out: 0, low: 1, dormant: 2, ok: 3 };
  rows.sort((a, b) => order[a.status] - order[b.status] || a.p.name.localeCompare(b.p.name));
  const total = rows.reduce((s, r) => s + r.L.value, 0n);
  const dormant = rows.filter((r) => r.status === 'dormant').reduce((s, r) => s + r.L.value, 0n);

  const services = S.r.product.filter((p) => !p.trackStock);

      <div class="card kpi"><span class="label">En rupture</span><span class="value">${rows.filter((r) => r.status === 'out').length}</span><span class="hint">${tf('Sous le seuil : {n}', { n: rows.filter((r) => r.status === 'low').length })}</span></div>
      <div class="card kpi"><span class="label">Stock dormant</span><span class="value">${fmt(dormant, C)}</span><span class="hint">${tf('Aucune vente depuis {d} jours', { d: STOCK_DORMANT_DAYS })}</span></div>
    </section>

      <tbody>${toOrder.map((r) => `<tr><td>${esc(r.p.name)} ${stockPill(r.status)}</td><td class="num">${fmtQty(r.L.qty)}</td><td class="num">${fmtQty(r.min)}</td><td class="num"><strong>${fmtQty(r.suggest)}</strong></td>
        <td class="num">${r.L.unit ? fmt(valueAt(r.suggest, r.L.unit), C) : '—'}</td><td class="num"><button class="btn sm primary" data-act="stock-order" data-id="${r.p.id}">Commander</button></td></tr>`).join('')}</tbody></table></div>
      <div class="card-pad small muted">${tr('« Commander » ouvre une facture fournisseur pré-remplie : la quantité entre en stock à la comptabilisation.')}</div></section>` : ''}
    <section class="card"><div class="card-head"><h2>Inventaire valorisé</h2></div><div class="table-wrap"><table>
      <thead><tr><th>Article</th><th>Statut</th><th class="num">En stock</th><th class="num">Coût moyen</th><th class="num">Valeur</th><th class="num">Prix HT</th><th class="num">Marge unitaire</th><th class="num">Sorties 90 j</th><th class="num">Couverture</th><th></th></tr></thead>
      <tbody>${rows.map((r) => {
        const uc = r.L.unitCost, price = BigInt(r.p.unitPrice);
        const um = uc != null ? price - uc : null;
        return `<tr><td>${esc(r.p.name)}</td><td>${stockPill(r.status)}</td><td class="num">${fmtQty(r.L.qty)}</td><td class="num">${uc != null ? fmt(uc, C) : '<span class="muted">—</span>'}</td>
          <td class="num">${fmt(r.L.value, C)}</td><td class="num">${fmt(price, C)}</td>
          <td class="num">${um != null ? `${um < 0n ? '<span class="pill late">' + tr('À perte') + '</span> ' : ''}${fmt(um, C)} <span class="muted small">${fmtRate(rateBp(um, price))}</span>` : '—'}</td>

          <td class="num nowrap"><button class="btn sm ghost" data-act="stock-settings" data-id="${r.p.id}">Seuils et coût</button> <button class="btn sm" data-act="adjust-stock" data-id="${r.p.id}">Inventaire</button></td></tr>`;
      }).join('') || `<tr><td colspan="10" class="empty">${tr('Aucune marchandise suivie en stock. Créez un produit de type « Marchandise ».')}</td></tr>`}</tbody>
      ${rows.length ? `<tfoot><tr><td colspan="4">Total</td><td class="num">${fmt(total, C)}</td><td colspan="5"></td></tr></tfoot>` : ''}</table></div></section>
    ${services.length ? `<section class="card"><div class="card-head"><h2>Coût de revient des services</h2></div><div class="table-wrap"><table>

      <tbody>${services.map((p) => { const c = p.unitCost != null && p.unitCost !== '' ? BigInt(p.unitCost) : null; const pr = BigInt(p.unitPrice);
        return `<tr><td>${esc(p.name)}</td><td class="num">${fmt(pr, C)}</td><td class="num">${c != null ? fmt(c, C) : `<span class="muted">${tr('Non renseigné')}</span>`}</td>
        <td class="num">${c != null ? `${fmt(pr - c, C)} <span class="muted small">${fmtRate(rateBp(pr - c, pr))}</span>` : '—'}</td>
        <td class="num"><button class="btn sm ghost" data-act="stock-settings" data-id="${p.id}">Définir le coût</button></td></tr>`; }).join('')}</tbody></table></div>
      <div class="card-pad small muted">${tr('Le coût standard d’un service (temps passé, sous-traitance) sert au calcul de sa marge.')}</div></section>` : ''}
    <p class="small muted">${tr('La valeur du stock sert à l’inventaire de fin d’exercice (variation de stocks) : faites valider l’écriture par votre expert-comptable.')}</p>`;
}

const MOVE_KIND = { in: 'Entrée (achat)', out: 'Sortie (vente)', adj: 'Ajustement d’inventaire', open: 'Stock d’ouverture' };
function stockTabMoves() {

  const all = prods.filter((p) => !sel || p.id === sel).flatMap((p) => L.get(p.id).moves.map((m, i) => ({ ...m, p, i })))
    .sort((a, b) => (a.date === b.date ? b.i - a.i : a.date < b.date ? 1 : -1)).slice(0, 400);
  const tIn = all.filter((m) => m.qty > 0n).reduce((s, m) => s + m.value, 0n), tOut = all.filter((m) => m.qty < 0n).reduce((s, m) => s - m.value, 0n);

        <option value="">Tous les articles</option>${prods.map((p) => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div></div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Article</th><th>Mouvement</th><th>Pièce</th><th class="num">Quantité</th><th class="num">Coût unitaire</th><th class="num">Valeur</th>${sel ? '<th class="num">Stock après</th><th class="num">Valeur après</th>' : ''}</tr></thead>
      <tbody>${all.map((m) => `<tr><td class="nowrap">${fmtDate(m.date)}</td><td>${esc(m.p.name)}</td><td>${tr(MOVE_KIND[m.kind])}</td><td class="small"><span class="mono" data-raw>${esc(tr(m.ref))}</span>${m.partner ? ` <span class="muted">· ${esc(m.partner)}</span>` : ''}</td>
        <td class="num ${m.qty < 0n ? 'neg' : ''}">${m.qty > 0n ? '+' : ''}${fmtQty(m.qty)}</td><td class="num">${fmt(m.unit, C)}</td><td class="num">${fmt(m.value, C)}</td>
        ${sel ? `<td class="num">${fmtQty(m.balQty)}</td><td class="num">${fmt(m.balValue, C)}</td>` : ''}</tr>`).join('') || `<tr><td colspan="9" class="empty">${tr('Aucun mouvement.')}</td></tr>`}</tbody>
      ${all.length ? `<tfoot><tr><td colspan="4">${tr('Entrées')} ${fmt(tIn, C)} · ${tr('Sorties au coût')} ${fmt(tOut, C)}</td><td colspan="${sel ? 5 : 3}"></td></tr></tfoot>` : ''}</table></div>
    </section>`;
}

function periodChips() {
  return `<div class="chips" aria-label="Période">${Object.entries(MARGIN_PERIODS).map(([k, l]) => `<button class="chip" data-act="stock-period" data-p="${k}" aria-pressed="${S.stock.period === k}">${l}</button>`).join('')}</div>`;
}
function marginTable(groups, firstCol, C) {
  const target = marginTarget();
  return `<div class="table-wrap"><table><thead><tr><th>${firstCol}</th><th class="num">CA HT</th><th class="num">Coût des ventes</th><th class="num">Marge brute</th><th class="num">Taux de marge</th><th class="num">Part de la marge</th></tr></thead>
    <tbody>${(() => { const tm = groups.reduce((s, g) => s + g.margin, 0n); return groups.map((g) => `<tr><td>${esc(g.label)}${g.uncosted ? ` <span class="pill draft" title="${esc(tr('Coût non renseigné : marge surestimée'))}">${tr('coût manquant')}</span>` : ''}</td>
      <td class="num">${fmt(g.revenue, C)}</td><td class="num">${fmt(g.cost, C)}</td><td class="num ${g.margin < 0n ? 'neg' : ''}">${fmt(g.margin, C)}</td>
      <td class="num">${g.rate != null && g.rate < 0 ? '<span class="pill late">' + tr('À perte') + '</span> ' : g.rate != null && g.rate < target ? '<span class="pill partial">' + tr('Sous l’objectif') + '</span> ' : ''}${fmtRate(g.rate)}</td>
      <td class="num"><span class="meter" aria-hidden="true"><span style="inline-size:${tm > 0n && g.margin > 0n ? Math.min(100, Number(mulDiv(g.margin, 100n, tm))) : 0}%"></span></span> ${fmtRate(rateBp(g.margin, tm))}</td></tr>`).join(''); })()
      || `<tr><td colspan="6" class="empty">${tr('Aucune vente sur la période.')}</td></tr>`}</tbody></table></div>`;
}
function stockTabMargins() {
  const C = cur();
  const [from, to] = periodRange(S.stock.period);
  const rows = marginLines(from, to);
  const rev = rows.reduce((s, r) => s + r.revenue, 0n), cost = rows.reduce((s, r) => s + r.cost, 0n), mg = rev - cost;
  const uncosted = rows.filter((r) => !r.costed);
  const byProduct = groupMargins(rows, (r) => r.productId || 'txt:' + r.label, (r) => r.label);
  const byCustomer = groupMargins(rows, (r) => r.customerId, (r) => byId('customer', r.customerId)?.name || '—');
  const months = monthKeys(from, to);
  const byMonth = new Map(months.map((k) => [k, { revenue: 0n, cost: 0n }]));
  for (const r of rows) { const g = byMonth.get(r.date.slice(0, 7)); if (g) { g.revenue += r.revenue; g.cost += r.cost; } }
  const mList = trimLeading(months.map((k) => ({ k, ...byMonth.get(k) })), (g) => g.revenue !== 0n);
  const maxV = mList.reduce((m, g) => (g.revenue > m ? g.revenue : m), 1n);
  const W = 640, H = 170, bw = W / Math.max(mList.length, 1);
  const bars = mList.map((g, i) => {
    const x = i * bw + bw * 0.18, w = bw * 0.64;
    const hr = Number(mulDiv(g.revenue, BigInt(H - 30), maxV)), hm = Number(mulDiv(g.revenue - g.cost > 0n ? g.revenue - g.cost : 0n, BigInt(H - 30), maxV));
    return `<rect class="bar ghost" x="${x.toFixed(1)}" y="${(H - 20 - hr).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hr, 1)}" rx="3"><title>${stockMonthLabel(g.k)} · ${tr('CA HT')} ${fmt(g.revenue, C)}</title></rect>
      <rect class="bar" x="${x.toFixed(1)}" y="${(H - 20 - hm).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hm, 0)}" rx="3"><title>${stockMonthLabel(g.k)} · ${tr('Marge brute')} ${fmt(g.revenue - g.cost, C)} (${fmtRate(rateBp(g.revenue - g.cost, g.revenue))})</title></rect>
      <text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" class="axis">${esc(stockMonthLabel(g.k))}</text>`;
  }).join('');
  return `${periodChips()}
    <section class="kpis" aria-label="Indicateurs">
      <div class="card kpi"><span class="label">CA HT</span><span class="value">${fmt(rev, C)}</span><span class="hint">${tp(new Set(rows.map((r) => r.inv.id)).size, '{n} facture', '{n} factures')}</span></div>
      <div class="card kpi"><span class="label">Coût des ventes</span><span class="value">${fmt(cost, C)}</span><span class="hint">Marchandises au coût moyen + coûts standard</span></div>
      <div class="card kpi"><span class="label">Marge brute</span><span class="value">${fmt(mg, C)}</span><span class="hint">${tf('Taux de marge {r}', { r: fmtRate(rateBp(mg, rev)) })}</span></div>
      <div class="card kpi"><span class="label">Coefficient de marque</span><span class="value">${cost > 0n ? new Intl.NumberFormat(LOC(), { maximumFractionDigits: 2 }).format(Number(mulDiv(rev, 100n, cost)) / 100) : '—'}</span><span class="hint">CA HT ÷ coût des ventes</span></div>
    </section>
    ${uncosted.length ? `<div class="banner">${tf('{n} ligne(s) vendue(s) sans coût de revient : leur marge est comptée à 100 %. Renseignez le coût standard des services dans « État du stock ».', { n: uncosted.length })}</div>` : ''}
    <section class="card"><div class="card-head"><h2>Marge par mois</h2><span class="legend small"><span class="sw ghost"></span>${tr('CA HT')} <span class="sw"></span>${tr('Marge brute')}</span></div>
      <div class="card-pad"><svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr('Marge par mois'))}">${bars}</svg></div></section>
    <section class="card"><div class="card-head"><h2>Marge par produit</h2>
      <form class="inline-form" data-form="margin-target"><label for="mt" class="small">${tr('Objectif de taux de marge (%)')}</label><input id="mt" name="target" type="text" inputmode="decimal" size="5" value="${String(marginTarget() / 100).replace('.', decSep())}"><button class="btn sm">OK</button></form></div>
      ${marginTable(byProduct, tr('Produit ou service'), C)}</section>
    <section class="card"><div class="card-head"><h2>Marge par client</h2></div>${marginTable(byCustomer, tr('Client'), C)}</section>`;
}

function stockTabCosts() {
  const C = cur();
  const [from, to] = periodRange(S.stock.period);
  const cs = costStructure(from, to);
  const t = cs.tot;
  const prods = S.r.product;
  const sim = S.stock.sim;
  const sp = prods.find((p) => p.id === sim.productId) || prods[0];
  let simHtml = '';
  if (sp) {
    const L = sp.trackStock ? ledgers().get(sp.id) : null;
    const unitCost = L ? L.unitCost : sp.unitCost != null && sp.unitCost !== '' ? BigInt(sp.unitCost) : null;
    const price = BigInt(sp.unitPrice);
    let targetBp = marginTarget();
    try { if (sim.target !== '') targetBp = Math.round(Number(normalizeNumber(sim.target)) * 100); } catch {}
    const valid = Number.isFinite(targetBp) && targetBp >= 0 && targetBp < 10000;
    const suggested = unitCost != null && valid ? mulDiv(unitCost, 10000n, BigInt(10000 - targetBp)) : null;
    const k = minorOf(C);
    const vatBp = BigInt(sp.taxRateBp || 0);
    simHtml = `<div class="row"><div class="field"><label for="sim-p">Produit ou service</label><select id="sim-p" data-change="sim-product">${prods.map((p) => `<option value="${p.id}" ${p.id === sp.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="field"><label for="sim-t">Taux de marge visé (%)</label><input id="sim-t" type="text" inputmode="decimal" data-change="sim-target" value="${esc(sim.target !== '' ? sim.target : String(marginTarget() / 100).replace('.', decSep()))}"></div></div>
      ${unitCost == null ? `<p class="muted">${tr('Aucun coût connu pour cet article : saisissez un achat ou un coût standard.')}</p>` : `
      <div class="sim-grid">
        <div><div class="muted small">${tr('Coût de revient unitaire')}</div><strong>${fmt(unitCost, C)}</strong></div>
        <div><div class="muted small">${tr('Prix HT actuel')}</div><strong>${fmt(price, C)}</strong> <span class="muted small">${fmtRate(rateBp(price - unitCost, price))}</span></div>
        <div><div class="muted small">${tr('Prix HT conseillé')}</div><strong class="accent">${suggested != null ? fmt(suggested, C) : '—'}</strong></div>
        <div><div class="muted small">${tr('Prix TTC conseillé')}</div><strong>${suggested != null ? fmt(suggested + divRound(suggested * vatBp, 10000n), C) : '—'}</strong></div>
      </div>
      ${valid ? '' : `<p class="neg small">${tr('Le taux de marge doit être compris entre 0 et 99,99 %.')}</p>`}
      <p class="small muted">${tr('Prix conseillé = coût ÷ (1 − taux de marge). Le taux de marge se calcule sur le prix de vente HT.')}${k === 0 ? '' : ''}</p>
      ${suggested != null && suggested !== price ? `<div class="actions"><button class="btn" data-act="apply-price" data-id="${sp.id}" data-price="${suggested}">${tf('Appliquer {p} comme prix de vente', { p: fmt(suggested, C) })}</button></div>` : ''}`}`;
  }
  const line = (label, v, strong) => `<tr${strong ? ' class="total-row"' : ''}><td>${label}</td>${cs.list.map((g) => `<td class="num ${g[v] < 0n ? 'neg' : ''}">${fmt(g[v], C)}</td>`).join('')}<td class="num ${t[v] < 0n ? 'neg' : ''}"><strong>${fmt(t[v], C)}</strong></td></tr>`;
  return `${periodChips()}
    <section class="kpis" aria-label="Indicateurs">
      <div class="card kpi"><span class="label">Marge brute</span><span class="value">${fmt(t.gross, C)}</span><span class="hint">${tf('Taux de marge {r}', { r: fmtRate(t.rate) })}</span></div>
      <div class="card kpi"><span class="label">Charges externes</span><span class="value">${fmt(t.charges, C)}</span><span class="hint">Achats de services et frais (HT)</span></div>
      <div class="card kpi"><span class="label">Résultat après charges</span><span class="value ${t.result < 0n ? 'neg' : ''}">${fmt(t.result, C)}</span><span class="hint">Hors salaires et amortissements non saisis</span></div>
      <div class="card kpi"><span class="label">Seuil de rentabilité mensuel</span><span class="value">${cs.breakEven != null ? fmt(cs.breakEven, C) : '—'}</span><span class="hint">${cs.breakEven != null ? tf('CA moyen actuel : {v}', { v: fmt(cs.avgRevenue, C) }) : tr('Marge nulle ou négative')}</span></div>
    </section>
    <section class="card"><div class="card-head"><h2>Structure des coûts par mois</h2></div>
      <div class="table-wrap"><table class="wide"><thead><tr><th></th>${cs.list.map((g) => `<th class="num">${esc(stockMonthLabel(g.k))}</th>`).join('')}<th class="num">Total</th></tr></thead>
      <tbody>${line(tr('CA HT'), 'revenue')}${line(tr('Coût des marchandises vendues'), 'cogs')}${line(tr('Coûts directs des services'), 'direct')}${line(tr('Marge brute'), 'gross', true)}
        <tr><td>${tr('Taux de marge')}</td>${cs.list.map((g) => `<td class="num">${fmtRate(g.rate)}</td>`).join('')}<td class="num"><strong>${fmtRate(t.rate)}</strong></td></tr>
        ${line(tr('Charges externes'), 'charges')}${line(tr('Résultat après charges'), 'result', true)}</tbody></table></div>
      <div class="card-pad small muted">${cs.fixedSource === 'forecast'
        ? tf('Seuil de rentabilité = charges fixes mensuelles ({f}, saisies dans Prévisions) ÷ taux de marge.', { f: fmt(cs.fixedMonthly, C) })
        : tf('Seuil de rentabilité = charges externes mensuelles moyennes ({f}) ÷ taux de marge. Saisissez vos charges récurrentes dans Prévisions pour l’affiner.', { f: fmt(cs.fixedMonthly, C) })}</div></section>
    <div class="grid-2">
      <section class="card"><div class="card-head"><h2>Charges externes par fournisseur</h2></div><div class="table-wrap"><table><tbody>
        ${cs.suppliers.map((s) => `<tr><td>${esc(s.name)}</td><td class="num">${fmt(s.v, C)}</td><td class="num muted small">${fmtRate(rateBp(s.v, t.charges))}</td></tr>`).join('') || `<tr><td class="empty">${tr('Aucune charge sur la période.')}</td></tr>`}</tbody></table></div></section>
      <section class="card"><div class="card-head"><h2>Simulateur de prix</h2></div><div class="card-pad stack">${simHtml || `<p class="muted">${tr('Créez d’abord un produit.')}</p>`}</div></section>
    </div>`;
}

function saveStockSettings(p, f) {
  const C = cur();
  if (p.trackStock) {
    const min = String(f.minQty || '').trim();
    p.minQty = min === '' || min === '0' ? '0' : String(parseQty(min));
    const re = String(f.reorderQty || '').trim();
    p.reorderQty = re === '' || re === '0' ? '' : String(parseQty(re));
  }
  const c = String(f.unitCost || '').trim();
  p.unitCost = c === '' ? '' : String(parseAmount(c, C));
  audit('Paramètres de stock et de coût modifiés', p.name);
  persist(p); persistMeta();
}

function stockXlsx() {
  const C = cur();
  const rows = S.r.product.filter((p) => p.trackStock).map(stockRow);
  const [from, to] = periodRange(S.stock.period);
  const lines = marginLines(from, to);
  const cs = costStructure(from, to);

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || !S.t) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'stock-tab': S.stock.tab = el.dataset.tab; render(); break;
    case 'stock-period': S.stock.period = el.dataset.p; render(); break;
    case 'stock-settings': openModal('stock-settings', { id }); break;
    case 'stock-order': {
      const r = stockRow(byId('product', id));
      const lastBill = r.L.lastIn && S.r.bill.find((b) => b.number === r.L.lastIn.ref);
      openModal('bill', { kind: 'goods', productId: id, qty: fmtQty(r.suggest).replace(/\s| | /g, ''), supplierId: lastBill ? lastBill.supplierId : '',
        net: r.L.unit ? amountInput(valueAt(r.suggest, r.L.unit), cur()) : '', rate: lastBill ? lastBill.taxRateBp : undefined });
      break;
    }
    case 'apply-price': {
      const p = byId('product', id); const old = p.unitPrice;
      p.unitPrice = String(BigInt(el.dataset.price));
      audit('Prix de vente modifié', `${p.name} : ${fmt(old, cur())} → ${fmt(p.unitPrice, cur())}`);
      persist(p); persistMeta(); render(); toast('Prix de vente mis à jour. Les factures déjà émises ne changent pas.');
      break;
    }
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target; if (!S.t) return;
  const k = el.dataset.change;
  if (k === 'stock-product') { S.stock.product = el.value; render(); }
  else if (k === 'sim-product') { S.stock.sim.productId = el.value; render(); }
  else if (k === 'sim-target') { S.stock.sim.target = el.value; render(); }
});
document.addEventListener('submit', (ev) => {
  const form = ev.target, kind = form.dataset.form;
  if (kind !== 'stock-settings' && kind !== 'margin-target') return;
  ev.preventDefault(); ev.stopImmediatePropagation();
  const f = Object.fromEntries(new FormData(form));
  try {
    if (kind === 'margin-target') {
      const v = Number(normalizeNumber(f.target));
      if (!Number.isFinite(v) || v < 0 || v >= 100) throw new Error('Le taux de marge doit être compris entre 0 et 99,99 %.');
      S.t.marginTargetBp = Math.round(v * 100); audit('Objectif de marge modifié', pct(S.t.marginTargetBp)); persistMeta(); render(); toast('Objectif de marge enregistré.');
    } else {
      saveStockSettings(byId('product', S.modal.data.id), f); closeModal(); render(); toast('Paramètres enregistrés.');
    }
  } catch (e) {
    if (S.modal && kind === 'stock-settings') { S.modal.error = tr(e.message); renderModal(); } else toast(e.message, true);
  }
}, true);

/* ============================================================================
   Help & support: help centre, contextual help, AI support assistant,
   support requests (each user's own) and the owner's support inbox.
   Storage on claude.ai (rules declared with the page):
     support-tickets/<uid>  written by that user only, read by the owner/editors
     support-replies/<uid>  written by the owner/editors only, read by that user
   ========================================================================== */
const APP_VERSION = '2026.11';
const snapData = (snap) => { try { return snap && typeof snap.data === 'function' ? snap.data() || null : null; } catch { return null; } };
const VIEW_LABELS = { tableau: 'Tableau de bord', clients: 'Clients', factures: 'Factures', produits: 'Produits et stock', achats: 'Achats', compta: 'Comptabilité',
  previsions: 'Prévisions', echanges: 'Import / Export', copilote: 'Copilote IA', parametres: 'Paramètres', aide: 'Aide et support', stock: 'Stock et marges' };
const HELP_FOR_VIEW = { tableau: 'demarrer', clients: 'clients', factures: 'factures', produits: 'produits', achats: 'achats', compta: 'compta',
  previsions: 'previsions', echanges: 'echanges', copilote: 'copilote', parametres: 'securite', stock: 'stock' };
const TICKET_CATEGORIES = { question: 'Question', bug: 'Problème technique', billing: 'Abonnement et facturation', feature: 'Suggestion' };
const TICKET_STATUS = { open: 'Ouverte', in_progress: 'En cours', resolved: 'Résolue', closed: 'Fermée' };
const TICKET_STATUS_CLASS = { open: 'issued', in_progress: 'partial', resolved: 'paid', closed: 'draft' };

const Support = {
  ready: false, mode: 'memory', uid: null, isAdmin: false, user: null, _mem: null,
  async init() {
    if (Store.mode === 'server') { this.mode = 'server'; this.uid = Store.uid; this.isAdmin = false; this.ready = true; return; }
    if (DEMO) { this.mode = 'memory'; this.uid = 'demo'; this.isAdmin = false; this.ready = true; return; }
    if (Store.mode === 'cloud') { this.mode = 'cloud'; this.uid = Store.uid; }
    else { this.mode = Store.mode; this.uid = 'local'; this.isAdmin = true; }
    const use = window.claude && typeof window.claude.use === 'function' ? window.claude.use.bind(window.claude) : null;
    if (use && this.mode === 'cloud') {
      try {
        const u = await use('user'); this.user = u;
        if (u) this.isAdmin = (await u.canEdit()) || (await u.isOwner());
      } catch { /* not an admin */ }
    }
    this.ready = true;
  },
  localGet() {
    try { return JSON.parse(localStorage.getItem('pme-suite.support') || '{}'); } catch { return (this._mem ||= {}); }
  },
  localSet(v) {
    try { localStorage.setItem('pme-suite.support', JSON.stringify(v)); } catch { this._mem = v; }
  },
  async loadMine() {
    if (this.mode === 'server') { const r = await api('GET', 'support'); return { tickets: r.tickets || [], replies: r.replies || {} }; }
    if (this.mode === 'cloud') {
      const [t, r] = await Promise.all([Store.db.doc(`support-tickets/${this.uid}`).get(), Store.db.doc(`support-replies/${this.uid}`).get()]);
      const td = snapData(t), rd = snapData(r);
      return { tickets: td ? clone(td).tickets || [] : [], replies: rd ? clone(rd).replies || {} : {} };
    }
    const all = this.localGet();
    return { tickets: clone((all.tickets || {})[this.uid] || []), replies: clone((all.replies || {})[this.uid] || {}) };
  },
  saveMine(tickets) {
    if (this.mode === 'server') return Store.queued('support-mine', () => api('PUT', 'support', { tickets: clone(tickets) }));
    if (this.mode === 'cloud') {
      return Store.queued('support-mine', () => Store.db.doc(`support-tickets/${this.uid}`).set({ uid: this.uid, tickets: clone(tickets), updatedAt: new Date().toISOString() }));
    }
    const all = this.localGet(); (all.tickets ||= {})[this.uid] = clone(tickets); this.localSet(all);
    return Promise.resolve();
  },
  async loadInbox() {
    if (this.mode === 'cloud') {
      const [ts, rs] = await Promise.all([Store.db.collection('support-tickets').get(), Store.db.collection('support-replies').get()]);
      const docId = (d) => d.id || (d.ref && d.ref.id) || (snapData(d) || {}).uid;
      const replies = Object.fromEntries(rs.docs.filter((d) => snapData(d)).map((d) => [docId(d), clone(snapData(d)).replies || {}]));
      return ts.docs.filter((d) => snapData(d)).map((d) => ({ uid: docId(d), tickets: clone(snapData(d)).tickets || [], replies: replies[docId(d)] || {} }));
    }
    const all = this.localGet();
    return Object.entries(all.tickets || {}).map(([uid, tickets]) => ({ uid, tickets: clone(tickets), replies: clone((all.replies || {})[uid] || {}) }));
  },
  saveReplies(uid, replies) {
    if (this.mode === 'cloud') {
      return Store.queued('support-replies/' + uid, () => Store.db.doc(`support-replies/${uid}`).set({ uid, replies: clone(replies), updatedAt: new Date().toISOString() }));
    }
    const all = this.localGet(); (all.replies ||= {})[uid] = clone(replies); this.localSet(all);
    return Promise.resolve();
  },
};

S.help = { tab: 'guides', q: '', article: null, chat: [], busy: false, mine: null, open: null, inbox: null, inboxOpen: null, inboxFilter: 'todo', names: {}, loading: false };

/** One ticket as both sides see it: user messages + support replies, latest status wins. */
function ticketThread(t, rep) {
  const msgs = [...(t.messages || []).map((m) => ({ ...m, from: 'user' })), ...((rep && rep.messages) || []).map((m) => ({ ...m, from: 'support' }))]
    .sort((a, b) => a.at.localeCompare(b.at));
  let status = t.status || 'open', at = t.statusAt || t.createdAt;
  if (rep && rep.status && rep.statusAt && rep.statusAt > at) { status = rep.status; at = rep.statusAt; }
  const last = msgs[msgs.length - 1];
  return { msgs, status, last, lastAt: last ? last.at : t.createdAt };
}
function unreadForUser(t, rep) {
  const th = ticketThread(t, rep);
  return th.last && th.last.from === 'support' && th.status !== 'closed' && (!t.seenAt || th.last.at > t.seenAt);
}
const needsSupport = (th) => th.last && th.last.from === 'user' && (th.status === 'open' || th.status === 'in_progress');
function supportBadge() {
  let n = 0;
  if (S.help.mine) n += S.help.mine.tickets.filter((t) => unreadForUser(t, S.help.mine.replies[t.id])).length;
  if (Support.isAdmin && S.help.inbox) n += S.help.inbox.reduce((s, u) => s + u.tickets.filter((t) => needsSupport(ticketThread(t, u.replies[t.id]))).length, 0);
  return n ? String(n) : '';
}
const fmtDateTime = (iso) => new Date(iso).toLocaleString(LOC(), { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const statusPillTicket = (st) => `<span class="pill ${TICKET_STATUS_CLASS[st] || 'draft'}">${esc(tr(TICKET_STATUS[st] || st))}</span>`;
const normSearch = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

let supportLoading = null;
function loadSupport(which) {
  if (supportLoading) return supportLoading.then(() => (which === 'mine' || (S.help.mine && (!Support.isAdmin || S.help.inbox)) ? null : loadSupport(which)));
  supportLoading = loadSupportNow(which).finally(() => { supportLoading = null; });
  return supportLoading;
}
async function loadSupportNow(which) {
  S.help.loading = true; S.help.error = '';
  try {
    if (!Support.ready) await Support.init();
    if (which === 'mine' || which === 'both') S.help.mine = await Support.loadMine();
    if ((which === 'inbox' || which === 'both') && Support.isAdmin) {
      S.help.inbox = await Support.loadInbox();
      const uids = S.help.inbox.map((u) => u.uid).filter((u) => u !== 'local');
      if (Support.user && uids.length) {
        try { const ps = await Support.user.profiles(uids); for (const id of uids) S.help.names[id] = ps[id]?.name || ''; } catch {}
      }
    }
  } catch (e) {
    S.help.error = tr('Les demandes n’ont pas pu être chargées. Vérifiez votre connexion puis cliquez sur « Actualiser ».');
  }
  S.help.loading = false;
  if (S.t && !S.modal) render();
}

/* ---------------------------------------------------------------- views --- */
function viewHelp() {
  const h = S.help;
  if ((h.mine == null || (Support.isAdmin && h.inbox == null)) && !h.loading && !h.error) setTimeout(() => loadSupport('both'), 0);
  const mineBadge = h.mine ? h.mine.tickets.filter((t) => unreadForUser(t, h.mine.replies[t.id])).length : 0;
  const inboxBadge = Support.isAdmin && h.inbox ? h.inbox.reduce((s, u) => s + u.tickets.filter((t) => needsSupport(ticketThread(t, u.replies[t.id]))).length, 0) : 0;
  const tabs = [['guides', 'Guides'], ['faq', 'FAQ'], ['assistant', 'Assistant IA']];
  if (!DEMO) tabs.push(['mine', 'Mes demandes', mineBadge]);
  if (Support.isAdmin) tabs.push(['inbox', 'Boîte de réception', inboxBadge]);
  let body = '';
  if (h.tab === 'guides') body = h.article ? helpArticle(h.article) : helpGuides();
  else if (h.tab === 'faq') body = helpFaq();
  else if (h.tab === 'assistant') body = helpAssistant();
  else if (h.tab === 'mine') body = helpMine();
  else if (h.tab === 'inbox') body = helpInbox();
  return `<div class="page-head"><div><h1>Aide et support</h1><p>Guides pas à pas, réponses rapides et contact avec le support.</p></div>
      ${h.tab === 'guides' || h.tab === 'faq' ? `<div class="help-search"><label for="help-q" hidden>Rechercher dans l’aide</label><input id="help-q" type="search" placeholder="Rechercher dans l’aide…" value="${esc(h.q)}" data-input="help-q"></div>` : ''}</div>
    <div class="chips" role="tablist" aria-label="Aide">${tabs.map(([k, l, n]) => `<button class="chip" role="tab" data-act="help-tab" data-tab="${k}" aria-pressed="${h.tab === k}">${l}${n ? ` <span class="badge">${n}</span>` : ''}</button>`).join('')}</div>
    ${body}`;
}

function helpMatches(text) {
  const q = normSearch(S.help.q).trim();
  return !q || q.split(/\s+/).every((w) => normSearch(text).includes(w));
}
function helpGuides() {
  const list = HELP_ARTICLES.filter((a) => helpMatches([tr(a.title), tr(a.summary), ...a.steps.map(tr)].join(' ')));
  const faqHits = S.help.q ? HELP_FAQ.filter(([q, a]) => helpMatches(tr(q) + ' ' + tr(a))) : [];

function faqItem([q, a]) {

function helpMine() {
  const h = S.help;

  if (!h.mine) return `<p class="muted">${tr('Chargement…')}</p>`;

function ticketDiag() {

    ecran: S.help.from || S.view, stockage: Store.mode, navigateur: navigator.userAgent.slice(0, 140), date: new Date().toISOString() };

async function createTicket(f) {
  if (!f.subject.trim() || !f.text.trim()) throw new Error('Indiquez un objet et décrivez votre demande.');
  if (!S.help.mine) await loadSupport('mine');
  const now = new Date().toISOString();
  const t = { id: newId(), subject: f.subject.trim().slice(0, 140), category: f.category, priority: f.priority === 'urgent' ? 'urgent' : 'normal',
    status: 'open', createdAt: now, statusAt: now, seenAt: now, messages: [{ at: now, text: f.text.trim().slice(0, 5000) }], diag: f.diag ? ticketDiag() : null };
  const tickets = [t, ...S.help.mine.tickets];
  await Support.saveMine(tickets);
  S.help.mine.tickets = tickets;
  return t;
}
async function addUserMessage(id, text) {
  const now = new Date().toISOString();
  const tickets = clone(S.help.mine.tickets);
  const t = tickets.find((x) => x.id === id);
  const th = ticketThread(t, S.help.mine.replies[t.id]);
  t.messages.push({ at: now, text: text.trim().slice(0, 5000) }); t.seenAt = now;
  if (th.status === 'resolved' || th.status === 'closed') { t.status = 'open'; t.statusAt = now; }
  await Support.saveMine(tickets); S.help.mine.tickets = tickets;
}
async function setUserStatus(id, status) {
  const now = new Date().toISOString();
  const tickets = clone(S.help.mine.tickets);
  const t = tickets.find((x) => x.id === id); t.status = status; t.statusAt = now;
  await Support.saveMine(tickets); S.help.mine.tickets = tickets;
}
async function markSeen(id) {
  const t = S.help.mine && S.help.mine.tickets.find((x) => x.id === id);
  if (!t || !unreadForUser(t, S.help.mine.replies[t.id])) return;
  const tickets = clone(S.help.mine.tickets); tickets.find((x) => x.id === id).seenAt = new Date().toISOString();
  S.help.mine.tickets = tickets; Support.saveMine(tickets).catch(() => {});
}
async function supportReply(uid, tid, text, status) {
  const u = S.help.inbox.find((x) => x.uid === uid);
  const replies = clone(u.replies);
  const now = new Date().toISOString();
  const r = replies[tid] || { messages: [] };
  if (text && text.trim()) r.messages = [...(r.messages || []), { at: now, text: text.trim().slice(0, 5000) }];
  if (status) { r.status = status; r.statusAt = now; }
  replies[tid] = r;
  await Support.saveReplies(uid, replies);
  u.replies = replies;
  if (uid === Support.uid && S.help.mine) S.help.mine.replies = clone(replies);
}

function helpDocsText() {
  return HELP_ARTICLES.map((a) => `[${a.id}] ${tr(a.title)} — ${tr(a.summary)}\n${a.steps.map((s) => '- ' + tr(s)).join('\n')}`).join('\n\n')
    + '\n\nFAQ\n' + HELP_FAQ.map(([q, a]) => `Q: ${tr(q)}\nR: ${tr(a)}`).join('\n');
}
async function askSupport(question) {
  if (!S.ai || S.help.busy || !question.trim()) return;
  const h = S.help;
  h.chat.push({ role: 'user', content: question.trim() }, { role: 'assistant', content: tr('Réflexion…') });
  h.busy = true; render();
  const idx = h.chat.length - 1;
  const context = `Tu es l'assistant support de l'application Jumtoo (CRM, facturation, achats, stock, comptabilité, prévisions pour PME).
Réponds en ${LANGS[LANG].ai}, en 3 à 8 lignes, avec des étapes concrètes et les noms exacts des boutons tels qu'ils apparaissent dans la documentation.
Appuie-toi UNIQUEMENT sur la documentation ci-dessous. N'invente aucune fonction. Si la documentation ne couvre pas la question, si l'utilisateur signale un bug, une erreur ou un besoin d'abonnement, dis-le franchement et termine par la balise [[ticket]].
Quand un guide est pertinent, termine par sa balise, par exemple [[guide:factures]] (une seule balise de guide, avec l'identifiant entre crochets ci-dessous).
Contexte de l'utilisateur : pays ${S.t ? COUNTRIES[S.t.country].name : '—'}, devise ${S.t ? S.t.currency : '—'}, plan comptable ${S.t ? pack().label : '—'}, écran d'origine « ${tr(VIEW_LABELS[h.from] || VIEW_LABELS.tableau)} ».

DOCUMENTATION
${helpDocsText()}`;
  const msgs = h.chat.slice(0, -1).map((m, i) => ({ role: m.role, content: i === 0 ? context + '\n\nQuestion : ' + m.content : m.content }));
  try {
    const res = await S.ai(msgs, { modelTier: 'quick', cache: false,
      onText: ({ text }) => { h.chat[idx].content = text; const el = document.getElementById('hmsg-' + idx); if (el) el.innerHTML = renderAssistantText(text); } });
    h.chat[idx].content = res.text || h.chat[idx].content;
  } catch (e) {
    h.chat[idx].content = (e && e.code === 'rate_limited' ? tr('Trop de demandes pour le moment : réessayez dans une minute.') : tr('L’assistant n’a pas pu répondre.')) + ' [[ticket]]';
    if (e && e.code === 'not_granted') S.ai = null;
  }
  h.busy = false; render();
  const log = document.getElementById('help-log'); if (log) log.scrollTop = log.scrollHeight;
  document.getElementById('help-input')?.focus();
}

document.addEventListener('click', (ev) => {

    case 'help-tab':
      h.tab = el.dataset.tab; h.article = null; h.open = null; h.inboxOpen = null;
      if (h.tab === 'mine' || h.tab === 'inbox') { h.error = ''; loadSupport('both'); }
      render(); break;
    case 'help-article': h.tab = 'guides'; h.article = id; render(); document.getElementById('main')?.scrollTo(0, 0); break;
    case 'help-back': h.article = null; render(); break;
    case 'help-useful': toast('Merci pour votre retour !'); break;
    case 'help-ask': askSupport(el.dataset.q || el.textContent); break;
    case 'new-ticket': {
      const pre = {};
      if (el.dataset.article) { const a = HELP_ARTICLES.find((x) => x.id === el.dataset.article); if (a) pre.subject = tf('À propos du guide « {title} »', { title: tr(a.title) }); }
      if (el.dataset.from === 'assistant') { const q = [...h.chat].reverse().find((m) => m.role === 'user'); if (q) { pre.subject = q.content.slice(0, 120); pre.text = q.content; } }
      openTicketModal(pre); break;
    }
    case 'support-refresh': h.error = ''; h.mine = null; h.inbox = null; loadSupport('both'); render(); break;
    case 'ticket-open': h.open = id; markSeen(id); render(); break;
    case 'ticket-back': h.open = null; render(); break;
    case 'ticket-close': setUserStatus(id, 'closed').then(() => { render(); toast('Demande close.'); }).catch(onWriteError); break;
    case 'ticket-reopen': setUserStatus(id, 'open').then(() => { render(); toast('Demande rouverte.'); }).catch(onWriteError); break;
    case 'inbox-open': h.inboxOpen = id; render(); break;
    case 'inbox-back': h.inboxOpen = null; render(); break;
    case 'inbox-filter': h.inboxFilter = el.dataset.f; render(); break;
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.form && el.form.id === 'f-ticket' && S.modal && S.modal.kind === 'ticket' && el.name && el.type !== 'checkbox') { (S.modal.data ||= {})[el.name] = el.value; return; }
  if (el.dataset.input !== 'help-q') return;
  S.help.q = el.value; S.help.article = null;
  const pos = el.selectionStart; render();
  const n = document.getElementById('help-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener('submit', (ev) => {
  const form = ev.target, kind = form.dataset.form;
  if (!['ticket', 'help-chat', 'ticket-reply', 'inbox-reply'].includes(kind)) return;
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(form));
  const btns = form.querySelectorAll('button'); const fail = (e) => { btns.forEach((b) => (b.disabled = false)); if (S.modal) { S.modal.error = e.message; renderModal(); } else toast(e.message || 'Échec de l’enregistrement.', true); };
  if (kind === 'help-chat') { askSupport(f.q || ''); return; }
  btns.forEach((b) => (b.disabled = true));
  if (kind === 'ticket') {
    if (S.modal) Object.assign(S.modal.data, { subject: f.subject, text: f.text, category: f.category });
    document.querySelectorAll('button[form="f-ticket"]').forEach((b) => (b.disabled = true));
    createTicket({ ...f, diag: f.diag === 'on' }).then((t) => {
      closeModal(); S.help.tab = 'mine'; S.help.open = t.id; S.help.article = null;
      if (Support.isAdmin) S.help.inbox = null;
      go('aide'); toast('Demande envoyée. Le support vous répondra ici.');
    }).catch((e) => { document.querySelectorAll('button[form="f-ticket"]').forEach((b) => (b.disabled = false)); fail(e); });
  } else if (kind === 'ticket-reply') {
    if (!f.text.trim()) { fail(new Error('Écrivez un message.')); return; }
    addUserMessage(S.help.open, f.text).then(() => { if (Support.isAdmin) S.help.inbox = null; render(); toast('Message envoyé.'); }).catch(fail);
  } else if (kind === 'inbox-reply') {
    const [uid, tid] = S.help.inboxOpen.split('|');
    if (!f.text.trim() && !f.status) { fail(new Error('Écrivez un message.')); return; }
    supportReply(uid, tid, f.text, f.status).then(() => { render(); toast('Réponse envoyée.'); }).catch(fail);
  }
});

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'overlay' && ev.target !== el) return;
  if (el.tagName === 'BUTTON' && !el.closest('form')) ev.preventDefault();
  switch (act) {
    case 'go': go(el.dataset.view); break;
    case 'export': exportFile(el.dataset.kind, el.dataset.id); break;
    case 'fc-fill': {
      const sf = salesForecast(); const f = fc(); let n = 0;
      for (const m of sf.months) if (m.target == null && m.phase !== 'past') { f.targets[m.key] = String(sf.avg3); n++; }
      if (n) { audit('Objectifs de ventes complétés', `${n} mois à ${fmt(sf.avg3, cur())}`); persistMeta(); render(); toast(tf('{n} mois complétés.', { n })); } else toast('Tous les mois à venir ont déjà un objectif.');
      break;
    }
    case 'del-charge': {
      const f = fc(); const ch = f.charges.find((c) => c.id === id);
      f.charges = f.charges.filter((c) => c.id !== id); audit('Charge récurrente retirée', ch?.label || ''); persistMeta(); render();
      break;
    }
    case 'import-cancel': S.imp = { ...S.imp, analysis: null, fileName: '', error: '' }; render(); break;
    case 'import-confirm': {
      const n = applyImport(S.imp.analysis); const label = IMPORT_FIELDS[S.imp.type].label.toLowerCase();
      S.imp = { ...S.imp, analysis: null, fileName: '', error: '' }; render(); toast(tf('Import terminé : {n} ligne(s) ajoutée(s) ({label}).', { n, label: tr(label) }));
      break;
    }
    case 'overlay': case 'close': closeModal(); break;
    case 'create-demo': createTenant('Teranga Services (exemple)', 'SN', true); break;
    case 'new-tenant': openModal('tenant'); break;
    case 'open-tenant': openTenant(id); break;
    case 'delete-tenant': openModal('confirm-delete'); break;
    case 'confirm-delete': (async () => {
      const all = TYPES.flatMap((t) => S.r[t]); const tid = S.t.id;
      closeModal(); root.className = 'loading'; root.textContent = 'Suppression…';
      await Store.deleteTenant(tid, all).catch(onWriteError);
      S.tenants = S.tenants.filter((t) => t.id !== tid); S.t = null;
      if (S.tenants.length) openTenant(S.tenants[0].id); else render();
    })(); break;
    case 'new-customer': openModal('customer'); break;
    case 'edit-customer': openModal('customer', { id }); break;
    case 'new-product': openModal('product'); break;
    case 'adjust-stock': openModal('adjust', { id }); break;
    case 'new-invoice':
      if (!S.r.customer.length) { toast('Créez d’abord un client.', true); go('clients'); break; }
      S.draft = newDraft(el.dataset.customer || ''); openModal('invoice'); break;
    case 'edit-invoice': S.draft = draftFromInvoice(byId('invoice', id)); openModal('invoice'); break;
    case 'add-line': S.draft.lines.push({ productId: '', description: '', qty: '1', price: '', discount: '0', rate: String(COUNTRIES[S.t.country].rates[0]), kind: 'service' }); renderModal(); break;
    case 'remove-line': S.draft.lines.splice(Number(el.dataset.i), 1); renderModal(); break;
    case 'save-invoice': case 'save-issue-invoice': guard(() => {
      const inv = saveInvoice(S.draft, act === 'save-issue-invoice');
      closeModal(); render(); toast(inv.number ? tf('Facture {n} émise et comptabilisée.', { n: inv.number }) : 'Brouillon enregistré.');
    }); break;
    case 'issue': guard(() => { const inv = issueInvoice(id); closeModal(); render(); toast(tf('Facture {n} émise et comptabilisée.', { n: inv.number })); }); break;
    case 'show-invoice': openModal('show-invoice', { id }); break;
    case 'pay': openModal('pay', { id }); break;
    case 'remind': openModal('remind', { id, text: reminderTemplate(byId('invoice', id)) }); if (S.ai) draftReminder(id); break;
    case 'draft-reminder': draftReminder(id); break;
    case 'copy-reminder': {
      const text = document.getElementById('r-text')?.value || '';
      navigator.clipboard?.writeText(text).then(() => toast('Message copié.'), () => toast('Copie refusée par le navigateur : sélectionnez le texte et copiez-le.', true));
      break;
    }
    case 'mark-reminded': {
      const inv = byId('invoice', id);
      inv.reminders = [...(inv.reminders || []), { at: new Date().toISOString(), text: (document.getElementById('r-text')?.value || '').slice(0, 2000) }];
      audit('Relance envoyée', `${inv.number} — ${byId('customer', inv.customerId).name}`);
      persist(inv); persistMeta(); closeModal(); render(); toast('Relance tracée dans le journal d’audit.');
      break;
    }
    case 'new-bill': openModal('bill', {}); break;
    case 'pay-bill': openModal('pay-bill', { id }); break;
    case 'inv-filter': S.invFilter = el.dataset.f; render(); break;
    case 'compta-tab': S.comptaTab = el.dataset.tab; render(); break;
    case 'copy-balance': {
      const rows = [['Compte', 'Intitulé', 'Débit', 'Crédit', 'Solde'], ...trialBalance().map((x) => [x.a, x.label, toDec(x.d, minorOf(cur())), toDec(x.c, minorOf(cur())), toDec(x.bal, minorOf(cur()))])];
      navigator.clipboard?.writeText(rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n'))
        .then(() => toast('Balance copiée : collez-la dans un tableur.'), () => toast('Copie refusée par le navigateur.', true));
      break;
    }
    case 'ask': askCopilot(el.dataset.q); break;
    case 'chat-clear': S.chat = []; render(); break;
  }
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.change === 'lang') {
    setLang(el.value); if (S.t) render(); else renderWelcome();
    return;
  }
  if (el.dataset.change === 'switch-tenant') {
    if (el.value === '__new') { el.value = S.t.id; openModal('tenant'); } else openTenant(el.value);
  } else if (el.dataset.change === 'fc-target') {
    const f = fc(), key = el.dataset.month;
    try {
      if (el.value.trim() === '') delete f.targets[key];
      else f.targets[key] = String(parseAmount(el.value, cur()));
      persistMeta(); render();
    } catch (e) { toast(e.message, true); render(); }
  } else if (el.dataset.change === 'fc-future') {
    fc().futureSales = el.value === '1'; persistMeta(); render();
  } else if (el.dataset.change === 'fc-late') {
    fc().lateWeeks = Number(el.value); persistMeta(); render();
  } else if (el.dataset.change === 'fc-vat') {
    fc().vat = el.value === '1'; persistMeta(); render();
  } else if (el.dataset.change === 'import-type') {
    S.imp = { type: el.value, analysis: null, fileName: '', error: '', busy: false, token: (S.imp.token || 0) + 1 }; render();
  } else if (el.dataset.change === 'import-file') {
    const file = el.files?.[0]; if (!file) return;
    const token = (S.imp.token || 0) + 1, type = S.imp.type;
    S.imp = { ...S.imp, token, busy: true, error: '', analysis: null, fileName: file.name }; render();
    readImportFile(file).then((rows) => { const a = analyseImport(type, rows); a.fileName = file.name; return { analysis: a }; })
      .catch((e) => ({ error: e.message || 'Fichier illisible.' }))
      .then((res) => { if (S.imp.token !== token || S.imp.type !== type) return; // a newer file or type was chosen meanwhile
        S.imp = { ...S.imp, busy: false, analysis: res.analysis || null, error: res.error || '' }; render(); });
  } else if (el.dataset.change === 'bill-photo') {
    const form = document.getElementById('f-bill');
    if (form) Object.assign(S.modal.data, Object.fromEntries(new FormData(form)));
    readBillPhoto(el.files?.[0]);
  } else if (el.dataset.field === 'productId') {
    const l = S.draft.lines[Number(el.dataset.line)]; const p = byId('product', el.value);
    l.productId = el.value;
    if (p) { l.description = p.name; l.price = amountInput(p.unitPrice, cur()); l.rate = String(p.taxRateBp); l.kind = p.kind; }
    else l.kind = 'service';
    renderModal();
  } else if (el.dataset.draft) {
    S.draft[el.dataset.draft] = el.value;
  }
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset.line != null && S.draft) {
    S.draft.lines[Number(el.dataset.line)][el.dataset.field] = el.value;
    const t = document.getElementById('draft-totals'); if (t) t.innerHTML = draftTotalsHtml();
  } else if (el.dataset.draft && S.draft) S.draft[el.dataset.draft] = el.value;
});

document.addEventListener('submit', (ev) => {
  const form = ev.target; const kind = form.dataset.form;
  if (!kind) return;
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(form));
  if (kind === 'tenant') {
    if (!f.name?.trim()) return;
    createTenant(f.name, f.country, false);
    return;
  }
  if (kind === 'chat') { askCopilot(f.q || ''); return; }
  if (kind === 'charge') {
    try {
      const amount = parseAmount(f.amount, cur()); const day = Number(f.day);
      if (amount <= 0n) throw new Error('Le montant doit être positif.');
      if (!Number.isInteger(day) || day < 1 || day > 31) throw new Error('Jour du mois entre 1 et 31.');
      fc().charges.push({ id: newId(), label: f.label.trim(), amount: String(amount), day });
      audit('Charge récurrente ajoutée', `${f.label.trim()} — ${fmt(amount, cur())} le ${day}`); persistMeta(); render(); toast('Charge ajoutée à la prévision.');
    } catch (e) { toast(e.message, true); }
    return;
  }
  guard(() => {
    if (kind === 'customer') {
      if (!f.name.trim()) throw new Error('Saisissez la raison sociale.');
      const rec = S.modal.data.id ? byId('customer', S.modal.data.id) : addRecord({ t: 'customer', id: newId(), createdAt: new Date().toISOString() });
      Object.assign(rec, { name: f.name.trim(), email: f.email.trim(), phone: f.phone.trim(), taxId: f.taxId.trim() });
      if (!S.modal.data.id) audit('Client créé', rec.name);
      persist(rec); persistMeta(); closeModal(); render(); toast('Client enregistré.');
    } else if (kind === 'product') {
      const price = parseAmount(f.price, cur());
      const stock = f.kind === 'goods' ? (f.stock && f.stock !== '0' ? parseQty(f.stock) : 0n) : 0n;
      const unitCost = f.unitCost && String(f.unitCost).trim() ? String(parseAmount(f.unitCost, cur())) : '';
      const rec = addRecord({ t: 'product', id: newId(), name: f.name.trim(), kind: f.kind, unitPrice: String(price), taxRateBp: Number(f.rate), unitCost,
        trackStock: f.kind === 'goods', onHand: String(stock), moves: stock ? [{ date: today(), qty: String(stock), ref: 'Stock initial' }] : [], createdAt: new Date().toISOString() });
      audit('Produit créé', rec.name); persist(rec); persistMeta(); closeModal(); render(); toast('Produit enregistré.');
    } else if (kind === 'adjust') {
      const p = byId('product', S.modal.data.id);
      const counted = String(f.qty).trim() === '0' ? 0n : parseQty(f.qty);
      const diff = counted - BigInt(p.onHand || 0);
      if (diff !== 0n) {
        p.onHand = String(counted);
        p.moves = [{ date: today(), qty: String(diff), ref: 'Inventaire' }, ...(p.moves || [])].slice(0, 2000);
        audit('Stock ajusté', `${p.name} : ${diff > 0n ? '+' : ''}${fmtQty(diff)}`); persist(p); persistMeta();
      }
      closeModal(); render();
    } else if (kind === 'pay') {
      payInvoice(S.modal.data.id, f); closeModal(); render(); toast('Paiement enregistré et comptabilisé.');
    } else if (kind === 'bill') {
      const bill = saveBill(f); closeModal(); render(); toast(tf('Achat {n} comptabilisé.', { n: bill.number }));
    } else if (kind === 'pay-bill') {
      payBill(S.modal.data.id, f); closeModal(); render(); toast('Paiement fournisseur comptabilisé.');
    }
  });
});

document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.modal) closeModal(); });

function go(view) {
  S.view = VIEWS.includes(view) ? view : 'tableau';
  render();
  document.getElementById('main')?.scrollTo(0, 0);
  // Best effort only: keeps the view in the address bar where the host allows it.
  try { if (location.hash.slice(1) !== S.view) history.replaceState(null, '', '#' + S.view); } catch {}
}
function routeFromHash() {
  const h = location.hash.slice(1);
  S.view = VIEWS.includes(h) ? h : 'tableau';
  if (S.t) render();
}
window.addEventListener('hashchange', routeFromHash);

/* ============================================================================
   Boot
   ========================================================================== */
(async function boot() {
  applyLangToDocument();
  translateDom(root);
  try { await Store.init(); }
  catch (e) {
    if (SERVER) { root.className = 'loading'; root.textContent = tr('Impossible de charger les données de l’entreprise. Vérifiez votre connexion puis rechargez la page.'); return; }
    throw e;
  }
  S.tenants = await Store.listTenants().catch(() => []);
  S.tenants.sort((a, b) => a.createdAt.localeCompare(b.createdAt));
  const use = window.claude && typeof window.claude.use === 'function' ? window.claude.use.bind(window.claude) : null;
  if (use) {
    use('downloads').then((d) => { S.downloads = d || null; if (S.t && S.view === 'echanges') render(); }).catch(() => {});
    use('sample').then(async (s) => {
      if (!s) return;
      S.ai = s;
      try { S.aiImages = !!(await s.limits())?.images; } catch { S.aiImages = false; }
      if (S.t) render();
    }).catch(() => {});
  }
  S.view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'tableau';
  if (SERVER) {
    applyServerAccess();
    if (SERVER.ai) { S.ai = serverAi(); S.aiImages = true; }
    await openTenant(S.tenants[0].id);
    loadSupport('mine');
    const sync = () => { if (document.hidden || S.modal) return; Store.pull().then((changed) => { if (changed && !S.modal) render(); }).catch(() => {}); };
    setInterval(sync, 20000); document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
    return;
  }
  if (!S.tenants.length) { await createTenant('Teranga Services (exemple)', 'SN', true); return; }
  let last = null; try { last = localStorage.getItem('pme-suite.last'); } catch {}
  await openTenant(S.tenants.find((t) => t.id === last) ? last : S.tenants[0].id);
  loadSupport('both');
})();
</script>
